<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nekko app icons</title>
<style>
:root{--bg:#E3E2DE;--ink:#141414;--card:#FFFFFF;--rule:#C7C7C7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#E3E2DE;--card:#1f1f1f;--rule:#3a3a3a}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 64px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
main{max-width:1180px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:36px 0 12px;padding-top:12px;border-top:1px solid var(--rule)}
p{margin:0 0 12px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{margin:0;background:var(--card);padding:10px;border:1px solid var(--rule)}
.card figcaption{font-size:12px;margin-top:8px;word-break:break-all} .card a{color:inherit}
.tile{display:flex;justify-content:center;padding:6px}
.chk{background:repeating-conic-gradient(#d4d4d0 0 25%,#ecebe8 0 50%) 0 0/16px 16px}
.tile img{display:block;max-width:100%;height:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.m{position:relative;width:104px;height:104px;overflow:hidden;background:var(--bg)}
.m img{display:block;width:100%;height:100%}
.ci{border-radius:50%} .sqm{border-radius:22.4%}
.ad .ad-in{position:absolute;width:163.64%;height:163.64%;left:-31.82%;top:-31.82%}
.ad .ad-in img{position:absolute;inset:0}
.ad-full img{position:absolute;inset:0}
.ad-full{background:#1351AA}
.safe{position:absolute;left:19.44%;top:19.44%;width:61.11%;height:61.11%;border:2px solid #FF00AA}
.safec{position:absolute;left:19.44%;top:19.44%;width:61.11%;height:61.11%;border:2px solid #00AA55;border-radius:50%}
.mk .safe80{position:absolute;left:10%;top:10%;width:80%;height:80%;border:2px solid #FF00AA;border-radius:50%}
.inv{filter:invert(1)}
</style></head><body><main>
