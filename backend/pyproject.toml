[project]
name = "wakatta-api"
version = "0.1.0"
description = "Wakatta? backend: FastAPI + PostgreSQL (see docs/BACKEND_ARCHITECTURE.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-python-dateutil>=2.9.0.20261122",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "T20", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/**" = ["E501"]  # generated DDL strings

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
