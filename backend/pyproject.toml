[project]
name = "wakatta-api"
version = "0.1.0"
description = "Wakatta? backend: FastAPI + PostgreSQL (see docs/BACKEND_ARCHITECTURE.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.165.0",
    "google-auth[requests]>=2.63.1",  # FCM HTTP v1 sender (XREQ-014); google-genai already depends on it
    "google-genai>=3.6.1",
    "httpx2>=2.16.2",  # Groq backup (XREQ-003); google-genai already depends on it
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "python-dateutil>=4.0.0",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-python-dateutil>=2.9.0.20261122",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "T20", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/**" = ["E501"]  # generated DDL strings

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["app", "tests"]
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "app"
include_external_packages = true

# Architecture §4: routers never touch SQL or tables; domain stays pure; ai never reaches the data layers.
[[tool.importlinter.contracts]]
name = "Routers go through services"
type = "forbidden"
source_modules = ["app.routers"]
forbidden_modules = ["app.repositories", "app.models", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.repositories", "app.models", "app.services", "app.routers", "app.api", "sqlalchemy", "fastapi"]

[[tool.importlinter.contracts]]
name = "AI seam stays out of the data layers"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.repositories", "app.models", "app.services", "app.routers", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Repositories do not call upward"
type = "forbidden"
source_modules = ["app.repositories"]
forbidden_modules = ["app.services", "app.routers", "app.api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# G-11, G-22: CI runs `pytest --cov`, which fails below this.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 80
