openapi: 3.1.0
info:
  title: <Project> API
  version: 0.1.0
  description: Machine-readable twin of API_SPEC.md. Change both in the same PR.
servers:
  - url: http://localhost:8000
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthEnvelope"
              example:
                success: true
                data: { status: ok }
                message: ok
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [code, message, details]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object }
    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success: { const: false }
        error: { $ref: "#/components/schemas/Error" }
    HealthEnvelope:
      type: object
      required: [success, data, message]
      properties:
        success: { const: true }
        data:
          type: object
          required: [status]
          properties:
            status: { type: string }
        message: { type: string }
security:
  - bearerAuth: []
