.lf-title{margin:12px 4px 4px;font-size:24px;font-weight:400;line-height:1.3}
.lf-meta{margin:0 4px;font-size:14px;color:var(--on-2)}
.lf-steps{margin:0;padding:4px 0;list-style:none}
.lf-step{display:flex;gap:14px;padding:12px 16px;align-items:flex-start}
.lf-step+.lf-step{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-sn{position:relative;flex-shrink:0}
.lf-sn .lf-tile{width:48px;height:48px;border-radius:50%}
.lf-sn b{position:absolute;top:-4px;left:-4px;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:500;display:grid;place-items:center;box-shadow:0 0 0 2px var(--surface-1)}
.lf-stx{font-size:18px;line-height:1.5;padding-top:8px;flex:1;min-width:0}
.lf-alt{font-size:14px;color:var(--on-2);margin-top:2px;line-height:1.4}
.lf-evrow{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 16px}
.lf-evrow+.lf-evrow{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-dtile{width:56px;flex-shrink:0;text-align:center;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);padding:6px 0}
.lf-dtile b{display:block;font-size:22px;font-weight:500;line-height:1.1}
.lf-dtile i{display:block;font-style:normal;font-size:12px}
.lf-rembtn{height:48px;border-radius:24px;padding:0 16px 0 12px;gap:6px;flex-shrink:0}
.lf-rembtn.on{background:var(--primary);color:var(--on-primary)}
.lf-fly{position:relative;margin:0;border-radius:16px;overflow:hidden;background:var(--surface-3);min-height:180px;display:grid;place-items:center;color:var(--on-2)}
.lf-fly img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lf-fly figcaption{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:13px;color:var(--on-primary);background:linear-gradient(transparent,rgba(0,0,0,.6))}
.lf-quote{margin:0;padding:12px 16px;border-left:4px solid var(--primary);background:var(--surface-1);border-radius:0 12px 12px 0;font-size:15px;line-height:1.5}
.lf-quote small{display:block;color:var(--on-2);font-size:13px;margin-bottom:4px}
.lf-quote .lf-alt{margin-top:8px}
.lf-voice{display:flex;align-items:center;gap:12px;width:100%;height:64px;padding:0 16px 0 8px;border-radius:32px;background:var(--surface-2);margin-bottom:8px;text-align:left}
.lf-voice .lf-pl{width:48px;height:48px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex-shrink:0}
.lf-bars{flex:1;display:flex;align-items:center;gap:3px;height:32px}
.lf-bars i{flex:1;max-width:5px;border-radius:3px;background:var(--outline);transform-origin:center;height:100%;transform:scaleY(var(--h,.4))}
.lf-voice.play .lf-bars i{background:var(--primary);animation:lf-bar .9s var(--ease) infinite alternate;animation-delay:var(--dl,0ms)}
@keyframes lf-bar{to{transform:scaleY(.2)}}
.lf-voice small{font-size:13px;color:var(--on-2)}
.lf-spk.on{color:var(--primary);background:var(--primary-c)}

/* Check card */
.lf-chk{padding:16px}
.lf-chk .lf-q{font-size:18px;line-height:1.4;font-weight:500}
.lf-opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:8px 16px;margin-top:8px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--outline);font-size:17px;text-align:left;position:relative;overflow:hidden;background:var(--surface)}
.lf-opt .lf-ol{width:28px;height:28px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:14px;font-weight:500;flex-shrink:0}
.lf-opt .lf-i{margin-left:auto}
.lf-opt[data-r=right]{background:var(--ok-c);box-shadow:inset 0 0 0 2px var(--ok)}
.lf-opt[data-r=wrong]{background:var(--bad-c);box-shadow:inset 0 0 0 2px var(--bad)}
.lf-opt:disabled{cursor:default;color:var(--on)}
.lf-notsure{margin-top:8px;height:48px}
.lf-res{display:flex;align-items:flex-start;gap:10px;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface-3);font-size:15px;line-height:1.4}
.lf-res[data-s=green]{background:var(--ok-c)}
.lf-res[data-s=orange]{background:var(--warn-c)}
.lf-res[data-s=red]{background:var(--bad-c)}
.lf-res .lf-i{margin-top:1px}
.lf-res .btn{margin-top:8px;height:48px}
.lf-wrow{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px}
.lf-wrow+.lf-wrow{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-wrow small{display:block;font-size:13px;color:var(--on-2)}

/* Ask chat */
.lf-chat{display:flex;flex-direction:column;gap:8px;padding:12px 16px 16px}
.lf-b{max-width:88%;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.45;word-break:break-word}
.lf-b.me{align-self:flex-end;background:var(--primary);color:var(--on-primary);border-bottom-right-radius:4px}
.lf-b.me .lf-i{width:16px;height:16px;margin-right:4px;vertical-align:-2px}
.lf-b.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.lf-b.sen{align-self:flex-start;background:var(--primary-c);color:var(--on-primary-c);border-bottom-left-radius:4px}
.lf-who{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;margin-bottom:4px}
.lf-pend{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--on-2)}
.lf-pend::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn)}
.lf-src{margin-top:8px;border-radius:12px;background:var(--surface);padding:10px 12px;box-shadow:inset 3px 0 0 var(--primary),inset 0 0 0 1px var(--outline-2)}
.lf-src small{display:block;font-size:13px;font-weight:500;color:var(--on-2);margin-bottom:2px}
.lf-src p{margin:0;font-size:15px;line-height:1.45}
.lf-src .btn{height:48px;margin:6px 0 -6px -12px}
.lf-tr{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:12px;opacity:.8}
.lf-orig{margin-top:8px;padding-top:8px;border-top:1px solid var(--outline-2);font-size:15px}
.lf-link{display:inline-flex;align-items:center;height:48px;margin:0 -6px -6px;padding:0 6px;font-size:13px;font-weight:500;color:var(--primary)}
.lf-think{display:flex;gap:4px;padding:14px 16px}
.lf-think i{width:8px;height:8px;border-radius:50%;background:var(--outline);animation:lf-dot 1s infinite both}
.lf-think i:nth-child(2){animation-delay:.15s}.lf-think i:nth-child(3){animation-delay:.3s}
@keyframes lf-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.lf-comp{flex-shrink:0;background:var(--surface-1);padding:8px 12px calc(8px + var(--nav-h))}
.lf-sug{display:flex;gap:8px;overflow-x:auto;padding:0 0 8px}
.lf-sug::-webkit-scrollbar{display:none}
.lf-sug .chip{height:40px;font-size:15px;flex-shrink:0}
.lf-crow{display:flex;align-items:center;gap:4px}
.lf-in{flex:1;min-width:0;height:48px;padding:0 20px;border-radius:24px;border:0;outline:none;background:var(--surface-3);font-size:16px}
.lf-in:focus{box-shadow:inset 0 0 0 2px var(--primary)}
.lf-mic,.lf-send{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;position:relative;overflow:visible}
.lf-send{background:var(--primary);color:var(--on-primary)}
.lf-mic.on{background:var(--error);color:var(--on-primary)}
.lf-mic.on::after,.lf-micbig.on::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 currentColor;border:2px solid var(--error);animation:lf-ring 1.1s ease-out infinite;pointer-events:none}
@keyframes lf-ring{from{transform:scale(1);opacity:.7}to{transform:scale(1.6);opacity:0}}
.lf-inbox{padding:12px 16px}
.lf-ibox{padding:14px 16px;margin-bottom:12px}
.lf-ibox .lf-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--on-2)}
.lf-ibox .lf-top b{font-size:15px;font-weight:500;color:var(--on)}
.lf-ibox .lf-qj{font-size:17px;margin-top:8px;line-height:1.45}
.lf-ibox .lf-alt{margin-top:2px}
.lf-canned{display:block;width:100%;min-height:52px;margin-top:8px;padding:8px 16px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);text-align:left;font-size:15px;line-height:1.4;position:relative;overflow:hidden}
.lf-hint{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;margin-bottom:12px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--on-2);line-height:1.4}

/* notice-new */
.lf-seg{display:flex;border-radius:24px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden;margin-top:12px}
.lf-seg button{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;position:relative;overflow:hidden}
.lf-seg button+button{box-shadow:inset 1px 0 0 var(--outline)}
.lf-seg button.on{background:var(--primary-c);color:var(--on-primary-c)}
.lf-samples{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lf-smp{display:block;border-radius:12px;overflow:hidden;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--outline-2);text-align:left;position:relative}
.lf-smp .lf-img{display:block;position:relative;aspect-ratio:3/4;background:var(--surface-3)}
.lf-smp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lf-smp span.lf-cap{display:block;padding:8px;font-size:13px;line-height:1.3;min-height:56px}
.lf-ta{width:100%;min-height:120px;padding:12px 16px;border-radius:4px;border:1px solid var(--outline);background:none;outline:none;resize:none;font-size:16px;line-height:1.5}
.lf-ta:focus{border:2px solid var(--primary);padding:11px 15px}
.lf-wrap{display:flex;flex-wrap:wrap;gap:8px}
.lf-wrap .chip{height:40px;font-size:15px}
.lf-wrap .chip .lf-i{margin-right:6px}
.lf-scanbox{position:relative;border-radius:16px;overflow:hidden;background:var(--surface-3);aspect-ratio:4/3}
.lf-scanbox img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lf-scanbox::after{content:"";position:absolute;left:0;right:0;top:0;height:35%;background:linear-gradient(to bottom,transparent,color-mix(in srgb,var(--primary) 45%,transparent),transparent);animation:lf-sweep 1.1s linear infinite}
@keyframes lf-sweep{from{transform:translateY(-100%)}to{transform:translateY(290%)}}
.lf-busy{display:flex;align-items:center;gap:12px;margin:16px 4px 12px;font-size:15px;color:var(--on-2)}
.lf-sk{height:16px;margin:10px 0}
.lf-micbig{position:relative;width:96px;height:96px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin:20px auto 8px}
.lf-micbig .lf-i{width:44px;height:44px}
.lf-micbig.on{background:var(--error)}
.lf-micbig.on::after{inset:0}
.lf-cap2{text-align:center;font-size:15px;color:var(--on-2)}
.lf-field{display:block;width:100%;height:56px;padding:0 16px;border-radius:4px;border:1px solid var(--outline);background:none;outline:none;font-size:18px;font-weight:500}
.lf-field:focus{border:2px solid var(--primary);padding:0 15px}
.lf-ck{display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 16px;position:relative}
.lf-ck+.lf-ck{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-cbx{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:4px;border:2px solid var(--outline);margin:0;flex-shrink:0;position:relative;background:none}
.lf-cbx:checked{background:var(--primary);border-color:var(--primary)}
.lf-cbx:checked::after{content:"";position:absolute;left:6px;top:1px;width:6px;height:12px;border:solid var(--on-primary);border-width:0 2px 2px 0;transform:rotate(45deg)}
.lf-ck .lf-rmid b{font-size:16px}
.lf-qopt{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
.lf-qopt.ok{font-weight:500}
.lf-qopt .lf-i{color:var(--ok)}
.lf-qopt .sp{width:20px;flex-shrink:0}
.lf-bar{flex-shrink:0;display:flex;gap:8px;padding:12px 16px calc(12px + var(--nav-h));background:var(--surface-1)}
.lf-bar[hidden]{display:none}
.lf-bar .btn{flex:1;height:56px;border-radius:28px;font-size:16px}
.lf-bar .btn.outlined{flex:0 0 auto}
.lf-hasbar .content{padding-bottom:16px}
.lf-to{font-size:13px;color:var(--on-2);margin:8px 4px 0}

/* senpai / support log */
.lf-pair{padding:20px 16px;display:flex;gap:16px;align-items:center}
.lf-pair h2{margin:0;font-size:22px;font-weight:400}
.lf-pair small{display:block;font-size:14px;color:var(--on-2);margin-top:2px}
.lf-act{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.lf-act .btn{height:48px;border-radius:24px}
.lf-next{padding:16px}
.lf-next .lf-nt{display:flex;gap:12px;align-items:center}
.lf-next b{display:block;font-size:17px;font-weight:500;line-height:1.35}
.lf-next small{display:block;font-size:13px;color:var(--on-2);margin-top:2px}
.lf-next .btn{margin-top:14px;height:48px;border-radius:24px}
.lf-flt{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 8px}
.lf-flt::-webkit-scrollbar{display:none}
.lf-flt .chip{height:40px;font-size:15px;flex-shrink:0}
.lf-flt .chip .lf-av{margin-right:8px;margin-left:-8px}
.lf-fl{margin:8px 20px 0;font-size:12px;color:var(--on-2)}
.lf-sum{padding:16px;margin:8px 16px 0;background:var(--primary-c);color:var(--on-primary-c)}
.lf-sum b{display:block;font-size:20px;font-weight:500;line-height:1.35}
.lf-sum small{display:block;font-size:13px;margin-top:4px;opacity:.85}
.lf-ng{padding:12px 16px}
.lf-ng+.lf-ng{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-ng .lf-ngt{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:500}
.lf-ng .lf-ngt small{font-size:13px;color:var(--on-2);font-weight:400;white-space:nowrap}
.lf-wchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lf-wc{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:16px;font-size:13px;font-weight:500;color:var(--on);background:var(--surface-3)}
.lf-wc[data-s=green]{background:var(--ok-c)}.lf-wc[data-s=orange]{background:var(--warn-c)}.lf-wc[data-s=red]{background:var(--bad-c)}
.lf-wc .lf-st{height:auto;padding:0;background:none;border-radius:0;font-size:13px}
.lf-exp{margin:16px 16px 0;height:48px;border-radius:24px}

/* meet-up sheet, PDF preview */
.lf-sh{margin:0 0 4px;font-size:22px;font-weight:400}
.lf-lbl{margin:16px 0 8px;font-size:14px;font-weight:500;color:var(--on-2)}
.lf-sheet .btn.block{height:48px;margin-top:24px;border-radius:24px;font-size:16px}
.lf-pv{background:var(--surface-3);padding:12px;border-radius:12px;margin-top:12px}
.lf-paper{background:var(--surface);color:var(--on);border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.22),inset 0 0 0 1px var(--outline-2);padding:18px 16px;font-size:13px;line-height:1.5}
.lf-paper h2{margin:0;font-size:18px;font-weight:500;text-align:center}
.lf-paper h3{margin:14px 0 4px;font-size:13px;font-weight:500;padding-bottom:2px;border-bottom:1px solid var(--outline)}
.lf-paper .lf-ps{text-align:center;color:var(--on-2);font-size:12px;margin-top:2px}
.lf-tb{width:100%;border-collapse:collapse;font-size:12px}
.lf-tb td,.lf-tb th{padding:4px 4px;border-bottom:1px solid var(--outline-2);text-align:left;vertical-align:top}
.lf-tb th{font-weight:500;color:var(--on-2)}
.lf-sign{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;color:var(--on-2)}
.lf-sign span{border-top:1px solid var(--outline);padding-top:4px;min-width:40%}
.lf-pbtns{display:flex;gap:8px;margin-top:16px}
.lf-pbtns .btn{flex:1;height:48px;border-radius:24px}

/* ===== Part E: dark mode, large text, notification centre, onboarding, analytics, skills, follow-ups, learning ===== */

/* ---------- dark theme: M3 + status tokens ---------- */
:root{--ux-onbad:#fff}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#141218;--surface:#141218;--surface-1:#1d1b20;--surface-2:#211f26;--surface-3:#2b2930;
  --on:#e6e0e9;--on-2:#cac4d0;--outline:#938f99;--outline-2:#49454f;
  --primary:#d0bcff;--on-primary:#381e72;--primary-c:#4f378b;--on-primary-c:#eaddff;
  --error:#f2b8b5;--scrim:rgba(0,0,0,.6);
  --ok:#5bbd78;--ok-c:#17402a;--warn:#f0a030;--warn-c:#4a3410;--bad:#ef7b72;--bad-c:#5a201c;--wait:#9aa0a6;
  --b-ok-t:#a8dfb8;--b-warn-t:#f8d38a;--b-bad-t:#f7b8b2;--ux-onbad:#2b0a08;
}
:root[data-theme=dark] body{background:#0c0b0f}
:root[data-theme=dark] .snackbar{background:#e6e0e9;color:#322f35}
:root[data-theme=dark] .snackbar .btn.text{color:#6750a4!important}
/* part A hard-codes dark text on the light pastel status backgrounds: keep it readable on the dark ones */
:root[data-theme=dark] :is(.ch-op.ok,.ch-st.green,.ch-or.ok,.ch-res.green){color:var(--b-ok-t)}
:root[data-theme=dark] :is(.ch-st.orange,.ch-res.orange){color:var(--b-warn-t)}
:root[data-theme=dark] :is(.ch-st.red,.ch-or.bad,.ch-res.red){color:var(--b-bad-t)}

/* ---------- large text: root font + the key components grow ---------- */
html[data-large="1"]{font-size:112.5%}
html[data-large="1"] .screen .content,html[data-large="1"] .ux-ob{zoom:1.15}
html[data-large="1"] .appbar h1{font-size:25px}
html[data-large="1"] .tab{font-size:13px}
html[data-large="1"] .bd-title{font-size:19px}
html[data-large="1"] :is(.bd-meta,.bd-head,.bd-src){font-size:15px}
html[data-large="1"] .ch-ta{font-size:19px}
html[data-large="1"] .snackbar{font-size:16px}

/* ---------- bell badge ---------- */
.ux-bdg{position:absolute;top:6px;right:5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--bad);color:var(--ux-onbad);font-size:11px;font-weight:700;line-height:17px;text-align:center;pointer-events:none}
.ux-bdg[hidden]{display:none}

/* ---------- heads-up banner + offline banner ---------- */
.ux-heads{position:absolute;left:12px;right:12px;top:calc(var(--status-h) + 8px);z-index:850;transform:translateY(-160%);opacity:0;pointer-events:none;transition:transform .35s var(--ease-out),opacity .2s}
.ux-heads.on{transform:none;opacity:1;pointer-events:auto}
.ux-hd{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:16px;background:var(--surface-3);color:var(--on);box-shadow:0 6px 20px rgba(0,0,0,.28),inset 0 0 0 1px var(--outline-2)}
.ux-off{position:absolute;left:0;right:0;top:var(--status-h);height:28px;z-index:850;display:flex;align-items:center;justify-content:center;padding:0 12px;font-size:13px;font-weight:500;background:var(--warn-c);color:var(--b-warn-t);transform:translateY(-12px);opacity:0;pointer-events:none;transition:transform .3s var(--ease-out),opacity .2s}
.ux-off[data-k=ok]{background:var(--ok-c);color:var(--b-ok-t)}
.ux-offline .ux-off{transform:none;opacity:1}
.ux-offline .stage{top:28px}
.ux-offline .ux-heads{top:calc(var(--status-h) + 36px)}

/* ---------- notification centre ---------- */
.ux-markall{gap:6px;padding:0 12px;font-size:14px;height:40px;margin-right:4px}
.ux-markall .ic{width:20px;height:20px}
.ux-markall:disabled{opacity:.38}
.ux-nl{padding:4px 0}
.ux-nr{display:flex;gap:12px;width:100%;text-align:left;padding:12px 16px;min-height:72px;align-items:flex-start;position:relative;overflow:hidden}
.ux-nr.unread{background:var(--surface-1)}
.ux-ni{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--primary-c);color:var(--on-primary-c)}
.ux-ni[data-k=ok]{background:var(--ok-c);color:var(--b-ok-t)}.ux-ni[data-k=w]{background:var(--warn-c);color:var(--b-warn-t)}.ux-ni[data-k=b]{background:var(--bad-c);color:var(--b-bad-t)}
.ux-nm{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ux-nt{font-size:15px;font-weight:500;line-height:1.3}
.ux-nr:not(.unread) .ux-nt{font-weight:400}
.ux-nb{font-size:14px;color:var(--on-2);line-height:1.35}
.ux-nside{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.ux-ntime{font-size:12px;color:var(--on-2)}
.ux-ndot{width:10px;height:10px;border-radius:50%;background:var(--primary)}
.ux-empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:72px 24px;color:var(--on-2);text-align:center}
.ux-empty svg{width:56px;height:56px;fill:var(--outline)}
.ux-empty b{font-size:18px;font-weight:500;color:var(--on)}

/* ---------- settings rows ---------- */
.ux-row{width:100%;text-align:left}

/* ---------- onboarding ---------- */
.ux-ob{flex:1;display:flex;flex-direction:column;min-height:0}
.ux-obh{display:flex;align-items:center;justify-content:space-between;min-height:64px;padding:0 8px 0 4px;flex-shrink:0}
.ux-dots{display:flex;gap:8px}
.ux-dots i{width:8px;height:8px;border-radius:4px;background:var(--surface-3);transition:width .3s var(--ease),background .3s}
.ux-dots i.on{width:24px;background:var(--primary)}
.ux-obb{flex:1;overflow-y:auto;padding:8px 24px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ux-obb.slide>*{animation:ux-slide .4s var(--ease-out) both}
.ux-obb>*:nth-child(2){animation-delay:40ms}.ux-obb>*:nth-child(3){animation-delay:80ms}.ux-obb>*:nth-child(n+4){animation-delay:120ms}
@keyframes ux-slide{from{opacity:0;transform:translateX(28px)}}
.ux-obb h2{margin:8px 0 4px;font-size:26px;font-weight:400}
.ux-obb p{margin:0 0 20px;color:var(--on-2);font-size:16px;line-height:1.45;max-width:320px}
.ux-ob-ico{width:72px;height:72px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;margin-top:8px}
.ux-ob-ico svg{width:36px;height:36px;fill:currentColor}
.ux-obf{padding:12px 24px calc(20px + var(--nav-h));flex-shrink:0}
.ux-next{height:56px;border-radius:28px;font-size:16px}
.ux-next:disabled{background:var(--surface-3);color:var(--on-2);opacity:.7}
.ux-ob-sec{height:48px;border-radius:24px;margin-top:12px}
.ux-vf{position:relative;width:240px;height:240px;border-radius:24px;background:rgb(20 20 24);overflow:hidden;display:grid;place-items:end center;padding-bottom:16px}   /* camera view stays dark in both themes */
.ux-vf i{position:absolute;width:36px;height:36px;border:4px solid rgb(255 255 255 / .92)}
.ux-vf i:nth-child(1){top:24px;left:24px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}.ux-vf i:nth-child(2){top:24px;right:24px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.ux-vf i:nth-child(3){bottom:56px;left:24px;border-right:0;border-top:0;border-radius:0 0 0 10px}.ux-vf i:nth-child(4){bottom:56px;right:24px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.ux-scanline{position:absolute;left:28px;right:28px;top:36px;height:3px;border-radius:2px;background:var(--ok);opacity:0;box-shadow:0 0 12px var(--ok)}
.ux-vf.scanning .ux-scanline{opacity:1;animation:ux-scan 1.1s ease-in-out infinite alternate}
@keyframes ux-scan{to{transform:translateY(124px)}}
.ux-vf-t{position:relative;color:rgb(255 255 255 / .92);font-size:14px;font-weight:500}
.ux-joined{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 20px;border-radius:16px;background:var(--ok-c);color:var(--b-ok-t);animation:ux-pop .5s var(--ease-out)}
.ux-joined b{display:block;font-size:18px;font-weight:500}.ux-joined span{font-size:14px}
.ux-jc{width:48px;height:48px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;flex-shrink:0}
.ux-jc svg{width:28px;height:28px;fill:currentColor}
.ux-jav{display:flex;align-items:center;margin-top:16px;color:var(--on-2);font-size:14px}
.ux-jav .hm-av{margin-right:-8px;box-shadow:0 0 0 2px var(--bg)}.ux-jav span{margin-left:16px}
@keyframes ux-pop{from{opacity:0;transform:scale(.9)}}
.ux-langs{display:flex;flex-direction:column;gap:8px;width:100%}
.ux-lang{display:flex;align-items:center;justify-content:space-between;min-height:60px;padding:8px 16px;border-radius:16px;text-align:left;box-shadow:inset 0 0 0 1px var(--outline-2);background:var(--surface-1)}
.ux-lang b{display:block;font-size:17px;font-weight:500}.ux-lang small{font-size:13px;color:var(--on-2)}
.ux-lang.on{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-c);color:var(--on-primary-c)}.ux-lang.on small{color:inherit}
.ux-radio{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--outline);flex-shrink:0}
.ux-lang.on .ux-radio{box-shadow:inset 0 0 0 7px var(--primary)}
.ux-q{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.ux-q>b{font-size:18px;font-weight:500;margin-bottom:4px}
.ux-opt{min-height:56px;padding:0 16px;border-radius:16px;text-align:left;font-size:17px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--outline-2);transition:transform .15s var(--ease)}
.ux-opt:active{transform:scale(.98)}
.ux-opt.bad{background:var(--bad-c);color:var(--b-bad-t);box-shadow:inset 0 0 0 2px var(--bad);animation:ux-shake .4s}
@keyframes ux-shake{0%,100%{transform:none}25%{transform:translateX(-6px)}60%{transform:translateX(6px)}}
.ux-hint{font-size:14px;color:var(--b-bad-t);font-weight:500}
.ux-cele{position:relative;display:flex;flex-direction:column;align-items:center;padding-top:40px}
.ux-cbig{width:112px;height:112px;border-radius:50%;background:var(--ok);color:var(--bg);display:grid;place-items:center;animation:ux-big .7s var(--ease-out) both;margin-bottom:16px}
.ux-cbig svg{width:68px;height:68px;fill:currentColor}
@keyframes ux-big{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.ux-confetti{position:absolute;left:50%;top:96px;width:0;height:0}
.ux-confetti i{position:absolute;width:8px;height:14px;border-radius:2px;opacity:0;animation:ux-conf 1.3s var(--ease-out) var(--d) both}
.ux-confetti i[style*="--c:0"]{background:var(--primary)}.ux-confetti i[style*="--c:1"]{background:var(--ok)}.ux-confetti i[style*="--c:2"]{background:var(--warn)}.ux-confetti i[style*="--c:3"]{background:var(--bad)}
@keyframes ux-conf{0%{opacity:1;transform:translate(0,0) rotate(0)}45%{opacity:1;transform:translate(var(--x),var(--y)) rotate(var(--r))}100%{opacity:0;transform:translate(var(--x),calc(var(--y) + 180px)) rotate(calc(var(--r) * 2))}}
.ux-qrbox{background:#fff;padding:16px;border-radius:16px;margin-bottom:12px}   /* QR needs a white quiet zone in both themes */
.ux-qrbox svg{width:176px;height:176px;display:block}
.ux-code{font-size:28px;font-weight:500;letter-spacing:3px;font-variant-numeric:tabular-nums}
.ux-ob-pts{list-style:none;margin:0 0 8px;padding:0;text-align:left;display:flex;flex-direction:column;gap:12px;max-width:320px}
.ux-ob-pts li{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.ux-ob-pts svg{width:22px;height:22px;fill:var(--ok);flex-shrink:0}
.ux-granted{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;border-radius:24px;background:var(--ok-c);color:var(--b-ok-t);font-weight:500;margin-top:12px;animation:ux-pop .4s var(--ease-out)}
.ux-granted svg{width:22px;height:22px;fill:currentColor}

/* ---------- analytics ---------- */
.ux-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.ux-kpi{padding:16px}
.ux-kpi small{font-size:13px;color:var(--on-2);display:block}
.ux-kpi div{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.ux-kn{font-size:36px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums}
.ux-kpi span{font-size:14px;color:var(--on-2)}
.ux-chartw{position:relative;padding:8px 4px 0}
.ux-chart{display:block;width:100%;height:auto}
.ux-g{stroke:var(--outline-2);stroke-width:1;stroke-dasharray:3 4}
.ux-gl{fill:var(--on-2);font-size:10px}
.ux-area{fill:var(--primary);opacity:.15}
.ux-ln{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.ux-pt{fill:var(--primary);stroke:var(--surface-1);stroke-width:2}
.ux-pt.sel{r:7}
.ux-hit{fill:transparent;cursor:pointer}
.ux-tip{position:absolute;transform:translate(-50%,-165%);background:var(--on);color:var(--bg);font-size:13px;font-weight:500;padding:3px 10px;border-radius:8px;pointer-events:none;white-space:nowrap;transition:left .25s var(--ease),top .25s var(--ease)}
.ux-funnel{padding:6px 0}
.ux-fr{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center;min-height:36px;padding:0 16px}
.ux-fn{font-size:13px;color:var(--on-2)}
.ux-fr b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.ux-ft{height:14px;border-radius:7px;background:var(--surface-3);overflow:hidden}
.ux-ft i{display:block;height:100%;border-radius:7px;background:var(--primary);transform-origin:left;animation:ux-grow .6s var(--ease-out) both}
.ux-ft i[data-k=ok]{background:var(--ok)}.ux-ft i[data-k=bad]{background:var(--bad)}.ux-ft i[data-k=warn]{background:var(--warn)}
@keyframes ux-grow{from{transform:scaleX(.05)}}
.ux-bar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:10px 16px}
.ux-bar .grow{flex:1;min-width:0}.ux-bn{font-size:14px;margin-bottom:6px}
.ux-bc{font-size:14px;font-weight:500;min-width:40px;text-align:right}
.ux-vr{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:72px}
.ux-vr+.ux-vr{box-shadow:inset 0 1px 0 var(--outline-2)}
.ux-rank{width:28px;height:28px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.ux-vm{flex:1;min-width:0}
.ux-vt{display:flex;align-items:baseline;gap:8px}.ux-vt b{font-size:17px;font-weight:500}.ux-vt small{font-size:13px;color:var(--on-2)}
.ux-vs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px;font-size:13px;color:var(--on-2)}
.ux-avs{display:flex}.ux-avs .hm-av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface-1)}.ux-avs .hm-av:first-child{margin-left:0}
.ux-tr{display:inline-flex;align-items:center;font-size:12px;font-weight:500;padding:0 6px 0 2px;border-radius:10px;background:var(--surface-3)}
.ux-tr svg{width:16px;height:16px;fill:currentColor}
.ux-tr[data-d=up]{background:var(--bad-c);color:var(--b-bad-t)}.ux-tr[data-d=dn]{background:var(--ok-c);color:var(--b-ok-t)}
.ux-gadd{height:40px;padding:0 12px;font-size:13px;flex-shrink:0;white-space:normal;line-height:1.15;text-align:center;max-width:92px}
.ux-heat{padding:12px 0 4px}
.ux-hm{display:grid;grid-template-columns:76px repeat(var(--c),1fr);gap:6px;padding:0 12px}
.ux-hw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--on-2)}
.ux-ht{font-size:13px;align-self:center;overflow-wrap:anywhere}
.ux-hc{height:48px;border-radius:10px;background:var(--surface-2);font-size:16px;font-weight:500;color:var(--on);transition:transform .15s var(--ease)}
.ux-hc:active{transform:scale(.95)}
.ux-hc[data-n="1"],.ux-legend i[data-n="1"]{background:color-mix(in srgb,var(--warn) 35%,var(--surface))}
.ux-hc[data-n="2"],.ux-legend i[data-n="2"]{background:color-mix(in srgb,var(--warn) 75%,var(--surface))}
.ux-hc[data-n="3"],.ux-legend i[data-n="3"]{background:color-mix(in srgb,var(--bad) 80%,var(--surface))}
.ux-legend i[data-n="0"]{background:var(--surface-2)}
.ux-hc.sel{box-shadow:inset 0 0 0 3px var(--primary)}
.ux-legend{display:flex;gap:14px;padding:10px 16px 0;font-size:12px;color:var(--on-2)}
.ux-legend span{display:inline-flex;align-items:center;gap:6px}.ux-legend i{width:16px;height:16px;border-radius:4px;display:block}
.ux-hint2{padding:12px 16px;font-size:13px;color:var(--on-2)}
.ux-det{margin:8px 12px 12px;padding:12px;border-radius:12px;background:var(--surface-2)}
.ux-dh{display:flex;align-items:center;gap:8px;font-size:15px;flex-wrap:wrap}
.ux-dr{display:flex;align-items:center;gap:12px;padding:10px 0 0;box-shadow:inset 0 1px 0 var(--outline-2);margin-top:10px}
.ux-dr .grow{flex:1;min-width:0}
.ux-dq{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ux-dr small{font-size:12px;color:var(--on-2)}
.ux-open{height:40px;padding:0 14px;font-size:13px;flex-shrink:0}
.ux-value{margin-top:14px;padding:12px;border-radius:14px;background:var(--primary-c);color:var(--on-primary-c)}
.ux-vh{font-size:13px;font-weight:500;margin-bottom:10px}
.ux-v3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ux-vc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 4px;border-radius:12px;background:var(--surface)}
.ux-vc small{font-size:12px;font-weight:500;color:var(--on-2)}.ux-vc b{font-size:22px;font-weight:500;color:var(--on)}.ux-vc>span:last-child{font-size:12px;line-height:1.25;color:var(--on-2)}
.ux-vi{width:32px;height:32px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center}
.ux-vi svg{width:18px;height:18px;fill:currentColor}
.ux-vi.ux-gp{background:var(--warn-c);color:var(--b-warn-t)}.ux-vi.ux-fire{background:var(--bad-c);color:var(--b-bad-t)}

/* ---------- skill matrix ---------- */
.ux-sk{display:grid;grid-template-columns:72px repeat(var(--c),1fr);gap:8px;margin-top:12px;align-items:center}
.ux-sm{font-size:12px;font-weight:500;text-align:center;line-height:1.25;overflow-wrap:anywhere;padding:0 2px}
.ux-sw{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--on-2)}
.ux-sc{min-height:64px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;transition:transform .15s var(--ease)}
.ux-sc:active{transform:scale(.96)}
.ux-sc svg{width:22px;height:22px;fill:currentColor}
.ux-sc[data-k=valid],.ux-sl i[data-k=valid]{background:var(--ok-c);color:var(--b-ok-t)}
.ux-sc[data-k=expiring],.ux-sl i[data-k=expiring]{background:var(--warn-c);color:var(--b-warn-t);box-shadow:inset 0 0 0 2px var(--warn)}
.ux-sc[data-k=missing],.ux-sl i[data-k=missing]{background:transparent;color:var(--b-bad-t);box-shadow:inset 0 0 0 2px var(--bad)}
.ux-sl{flex-wrap:wrap;padding-left:0;padding-right:0}
.ux-sh .ux-shh{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ux-shh b{font-size:18px;font-weight:500}
.ux-assign{height:48px;border-radius:24px;margin-top:12px}

/* ---------- follow-ups ---------- */
.ux-chips{display:flex;gap:8px;margin:12px 0}
.ux-fc{flex:1;min-height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--outline);position:relative;overflow:hidden}
.ux-fc b{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--surface-3);font-size:12px;display:grid;place-items:center}
.ux-fc.on{background:var(--primary-c);color:var(--on-primary-c);box-shadow:none}
.ux-fi{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--surface-1);transition:transform .15s var(--ease)}

  const h = {};

    paired,
    on: (t, f) => (h[t] = h[t] || []).push(f),

  };

  /* ---------------- ask thread bits (quoted question + reply) ---------------- */
  function fillAsk(n, m) {

  /* ---------------- Wakatta card (foreman) ---------------- */
  const summary = (wk, ids) => ['green', 'orange', 'red', 'wait'].map(s => [s, ids.filter(u => wk.results[u].status === s).length]).filter(x => x[1]).map(([s, c]) => `<b>${c}</b> ${ST_JA[s]}`).join(' · ');
  const marks = (wk, u) => wk.questions.map((qq, i) => {
    const r = wk.results[u];
    if (!r || r.status === 'wait' || !r.answers) return `<span class="ch-mk">Q${i + 1} –</span>`;
    const ok = r.answers[i] === qq.answer;
    return `<span class="ch-mk ${ok ? 'ok' : 'no'}">Q${i + 1}${svg(ok ? 'check' : 'close')}</span>`;
  }).join('');
  function fillWk(n, m) {
    const w = $('.ch-wk', n); if (!w) return;
    const wk = m.wk, st = wk.stage, ids = Object.keys(wk.results), done = st >= 5;
    const allIn = ids.every(u => wk.results[u].status !== 'wait');
    const prev = JSON.parse(w.dataset.prev || '{}');
    const cur = {}; ids.forEach(u => cur[u] = wk.results[u].status);
    w.dataset.prev = JSON.stringify(cur);
    const pct = (st + 1) / 6, prevPct = w.dataset.pct || '0';
    const head = done
      ? `<span class="ch-dots">${ids.map(u => `<i class="ch-dot ${cur[u]}${prev[u] && prev[u] !== cur[u] ? ' pop' : ''}"></i>`).join('')}</span><span class="ch-pt">${summary(wk, ids)}</span>`
      : `<span class="spinner ch-spin"></span><span class="ch-pt">${JA_ING[st + 1]}… ${st + 2}/6</span>`;
    const pill = head + `<span class="ch-chev">${svg('more')}</span>` + (done ? '' : `<i class="ch-prog" style="transform:scaleX(${prevPct})"></i>`);
    const pb = $('.ch-pill', w);
    if (w._p !== pill) {
      w._p = pill; pb.innerHTML = pill; w.dataset.pct = pct;
      const bar = $('.ch-prog', pb);
      if (bar) { void bar.offsetWidth; bar.style.transform = `scaleX(${pct})`; }
    }
    // board
    const steps = JA_STEP.map((l, i) => {
      const dn = i === 5 ? (done && allIn) : i <= st, act = !dn && (i === st + 1 || (i === 5 && done));
      return `<li class="${dn ? 'done' : ''}"><span class="ch-tick">${dn ? svg('check') : act ? '<span class="spinner"></span>' : ''}</span>${l}</li>`;
    }).join('');
    const qs = wk.questions.map((qq, i) => `<div class="ch-q"><span class="ch-qn">Q${i + 1}</span><div><div class="ch-qt">${esc(qq.qJa)}</div><div class="ch-opts">${(qq.optionsJa || qq.options).map((o, j) => `<span class="ch-op${j === qq.answer ? ' ok' : ''}">${j === qq.answer ? svg('check') : ''}${esc(o)}</span>`).join('')}</div>${qq.term ? `<span class="ch-term">用語集 · ${esc(qq.term)} = ${esc(qq.options[qq.answer])}</span>` : ''}</div></div>`).join('');
    const rows = ids.map(u => {
      const s = cur[u], usr = DATA.users[u], r = wk.results[u], rd = wk.read && wk.read[u], R = wk.re && wk.re[u], nd = wk.nudged && wk.nudged[u];
      const tag = r.re && s === 'green' ? `<span class="ch-ret">${svg('redo')}再説明で理解</span>` : '';
      const fus = (DATA.followups || []).filter(f => f.msgId === m.id && f.user === u), fs = fus.some(f => f.status === 'open') ? 'open' : fus.some(f => f.status === 'clarified') ? 'clarified' : fus.length ? 'understood' : '';
      const fuh = fs ? `<span class="ch-fu ${fs}">${{open: '要フォロー', clarified: '説明済', understood: '理解'}[fs]}</span>` : '';
      const rdh = fuh + `<span class="ch-rd${rd ? ' on' : ''}">${rd ? svg('eye') + '既読 ' + esc(rd) : '未読'}</span>`;
      let act = '';
      if (s === 'orange' || s === 'red') {
        act = R && R.sel === undefined
          ? `<div class="ch-ract">${svg('redo')}再説明を送信済み · ${esc(R.at)} · 回答待ち</div>`
          : `<button class="btn tonal ch-again" data-act="again" data-u="${u}">${svg('redo')}もう一度説明する</button>` + (R ? '<span class="ch-ract no">再説明でも未理解</span>' : '');
      } else if (s === 'wait' && done) {
        act = nd ? `<div class="ch-ract">${svg('bell')}催促済み · ${esc(nd)}</div>` : `<button class="btn tonal ch-again" data-act="nudge" data-u="${u}">${svg('bell')}催促</button>`;
      }
      return `<div class="ch-wr"><span class="avatar" style="background:${usr.color}">${esc(usr.initials)}</span><div class="nm">${esc(nameOf(u))}<div class="ch-mks">${marks(wk, u)}${rdh}${tag}</div></div><span class="ch-st ${s}${prev[u] && prev[u] !== s ? ' pop' : ''}">${ST_JA[s]}</span></div>` + (act ? `<div class="ch-wa">${act}</div>` : '');
    }).join('');
    const nt = DATA.tasks.filter(t => t.from === m.id).length;
    const due = wk.due ? `<div class="ch-dl">${svg('clock')}回答期限 ${esc(wk.due)}</div>` : '';
    const board = `<div class="ch-h">進行状況</div><ul class="ch-steps">${steps}</ul><div class="ch-h">確認質問 (${wk.questions.length})</div>${qs}<div class="ch-h">作業員の回答</div>${due}${rows}` +
      `<button class="ch-gchip" data-act="gadd">${svg('book')}用語集に追加</button>` +
      (st >= 3 && nt ? `<button class="btn tonal block" data-act="board">${svg('task')}タスク${nt}件をボードに追加しました</button>` : '');
    if (w._b !== board) { w._b = board; $('.ch-bd', w).innerHTML = board; }
  }

  /* ---------------- Check card (worker) ---------------- */
  function chkHTML(m) {
    const qs = m.wk.questions, st = S.ws[m.id] || (S.ws[m.id] = {i: 0, ans: [], fb: null, anim: false});
    const res = m.wk.results[ME], head = (dots) => `<div class="ch-chk-h">${svg('eq')}<b>Wakatta?</b><span>${qs.length} quick question${qs.length > 1 ? 's' : ''}</span>${dots || ''}</div>`;
    if (res && res.status !== 'wait') {
      const ok = (res.answers || []).filter((a, i) => a === qs[i].answer).length;
      const mine = DATA.tasks.filter(t => t.from === m.id && t.assignees.includes(ME));
      const icon = {green: 'okc', orange: 'warn', red: 'bad'}[res.status];
      const sub = res.re && res.status === 'green' ? 'understood after Tanaka explained again' : res.status === 'green' ? '' : ' · Tanaka will explain again';
      return head() + `<div class="ch-res ${res.status}">${svg(icon)}<div><b>${STATUS[res.status]}</b><span>${ok} of ${qs.length} correct${res.re && res.status === 'green' ? ' · ' : ''}${res.status === 'green' && !res.re ? '' : sub}</span></div></div>` +
        (mine.length ? `<div class="ch-tk">${svg('okc')}Added to your Board</div><div class="ch-chips">${mine.map(t => `<button data-act="board">${esc(t.title)}</button>`).join('')}</div>` : '') +
        (res.status !== 'green' ? qs.map((qq, i) => (res.answers || [])[i] !== qq.answer ? explain(qq) : '').join('') : '') +
        (res.status !== 'green' && !(m.wk.re && m.wk.re[ME]) ? `<button class="btn tonal ch-ask" data-act="askagain">${svg('mic')}Ask Tanaka to explain again</button>` : '');
    }
    const qq = qs[st.i], fb = st.fb;
    const dots = `<span class="ch-pd">${qs.map((x, i) => `<i class="${i === st.i && !fb ? 'cur' : i < st.i || (i === st.i && fb) ? (st.ans[i] === x.answer ? 'ok' : 'no') : ''}"></i>`).join('')}</span>`;
    const opts = qq.options.concat(['Not sure']).map((o, j) => {
      const idx = j === qq.options.length ? -1 : j;
      let cls = idx === -1 ? ' ns' : '', ic = '';
      if (fb) {
        if (idx === qq.answer) { cls += ' ok'; ic = svg('check'); } else if (idx === fb.sel) { cls += ' bad'; ic = svg('close'); } else cls += ' dim';
      }
      return `<button class="ch-or${cls}" data-act="pick" data-i="${idx}">${esc(o)}${ic}</button>`;
    }).join('');
    const right = fb && fb.sel === qq.answer, ns = fb && fb.sel === -1;
    const anim = st.anim ? ' ch-slide' : ''; st.anim = false;
    const nd = m.wk.nudged && m.wk.nudged[ME] ? `<div class="ch-nd">${svg('bell')}Tanaka is waiting for your answer</div>` : '';
    const due = m.wk.due ? `<span class="ch-due">${svg('clock')}Reply by ${esc(m.wk.due)}</span>` : '';
    return head(dots) + nd + `<div class="ch-cq${anim}"><div class="ch-cqn">Question ${st.i + 1} of ${qs.length}${due}</div><div class="ch-cqt">${esc(qq.q)}</div>${opts}` +
      (fb ? `<div class="ch-fbt ${right ? 'ok' : 'bad'}">${svg(right ? 'okc' : 'bad')}${right ? 'Correct' : (ns ? 'No problem · answer: ' : 'Not quite · answer: ') + esc(qq.options[qq.answer])}</div>` : '') +
      (fb && !right ? explain(qq) : '') +
      (fb && !right && !ns ? `<button class="btn ch-next" data-act="nscont">${st.i + 1 < qs.length ? 'Next question' : 'Finish'}</button>` : '') +
      (ns ?`<div class="ch-nsp"><span>Not sure? Tanaka can answer you.</span><div><button class="btn" data-act="asktanaka">${svg('mic')}Ask Tanaka</button><button class="btn text" data-act="nscont">Continue</button></div></div>` :
        !fb ? `<button class="ch-asktxt" data-act="asktanaka">${svg('mic')}Ask Tanaka</button>` : '') + '</div>';
  }
  function fillChk(n, m) {
    const box = $('.ch-chk', n); if (!box || !m.wk) return;
    const h = chkHTML(m);
    if (box._c !== h) { box._c = h; box.innerHTML = h; box.classList.toggle('fb', !!(S.ws[m.id] && S.ws[m.id].fb)); if (S.ws[m.id] && S.ws[m.id].fb) requestAnimationFrame(() => box.scrollIntoView({block: 'nearest', behavior: 'smooth'})); }
  }
  function pick(id, idx) {
    const m = findMsg(id), st = S.ws[id]; if (!m || !st || st.fb) return;
    st.fb = {sel: idx}; st.ans[st.i] = idx; refresh(id);
    if (idx !== m.wk.questions[st.i].answer) return;   // wrong / "Not sure": read the explanation, then Next, Continue or Ask Tanaka
    const at = st.i;
    setTimeout(() => advance(id, at), 1100);
  }
  function advance(id, at) {
    const m = findMsg(id), st = S.ws[id]; if (!m || !st || !st.fb || st.i !== at) return;
    const qs = m.wk.questions;
    if (st.i + 1 < qs.length) { st.fb = null; st.i++; st.anim = true; refresh(id); } else {
      st.fb = null;
      submit(id, ME, st.ans.slice());
    }
  }
  // answer in + one Follow-up per wrong answer (or "Not sure"); ids are deterministic so replays are harmless
  function submit(id, user, answers) {
    const m = findMsg(id); if (!m) return;
    Bus.emit('check:answer', {msgId: id, user, answers, status: statusOf(m.wk.questions, answers)});
    m.wk.questions.forEach((qq, i) => {
      if (answers[i] === qq.answer) return;
      Bus.emit('followup:new', {id: `f_${id}_${user}_${i}`, msgId: id, thread: m.thread, user, term: topicOf(qq), question: qq.q, questionJa: qq.qJa, wrong: answers[i] === -1 || answers[i] === undefined ? 'Not sure' : qq.options[answers[i]], at: new Date().toISOString(), status: 'open'});
    });
  }
  const fuOf = (id, user) => (DATA.followups || []).filter(f => f.msgId === id && f.user === user);
  function resolveFu(id, user, from, status, note) {
    fuOf(id, user).filter(f => f.status === from).forEach(f => Bus.emit('followup:resolve', {id: f.id, status, note, by: 'u_tanaka', at: new Date().toISOString()}));
  }

  /* ---------------- re-explain bubble (worker, addressed to one worker) ---------------- */
  function buildRe(m) {
    const n = document.createElement('div');
    n.className = 'ch-m oth ch-rxn';
    n.dataset.id = m.id + '~re'; n.dataset.mid = m.id;
    const u = DATA.users.u_tanaka;
    n.innerHTML = `<div class="ch-av avatar" style="background:${u.color}">${esc(u.initials)}</div><div class="ch-col"><div class="ch-nm">${esc(nameOf('u_tanaka'))}</div><div class="ch-rxb"></div></div>`;
    return n;
  }
  function fillRe(n, m) {
    const R = m.wk && m.wk.re && m.wk.re[ME], box = $('.ch-rxb', n); if (!R || !box) return;
    const qq = R.question, done = R.sel !== undefined, ok = R.sel === qq.answer;
    const opts = qq.options.map((o, j) => {
      let cls = '', ic = '';
      if (done) { if (j === qq.answer) { cls = ' ok'; ic = svg('check'); } else if (j === R.sel) { cls = ' bad'; ic = svg('close'); } else cls = ' dim'; }
      return `<button class="ch-or${cls}" data-act="rpick" data-i="${j}">${esc(o)}${ic}</button>`;
    }).join('');
    const h = `<div class="ch-rxt">${svg('redo')}<b>Explained again, just for you</b></div>` +
      `<div class="ch-bub ch-rxbub"><div class="ch-tx">${hl(R.en, true)}</div><div class="ch-rjp" lang="ja">${esc(R.ja)}</div><div class="ch-pics">${picHTML(R.pics)}</div>${spkBtn(R.en)}</div>` +
      `<div class="ch-rck${done ? ' fb' : ''}"><div class="ch-cqn">New question</div><div class="ch-cqt">${esc(qq.q)}</div>${opts}` +
      (done ? `<div class="ch-fbt ${ok ? 'ok' : 'bad'}">${svg(ok ? 'okc' : 'bad')}${ok ? 'Wakatta! Tanaka can see you understood.' : 'Not quite · answer: ' + esc(qq.options[qq.answer]) + '. Tanaka will help you in person.'}</div>` : '') + '</div>' +
      `<div class="ch-meta">${esc(R.at)}</div>`;
    if (n._r !== h) { n._r = h; box.innerHTML = h; }
  }

  /* ---------------- composer ---------------- */
  const setSt = s => { C.st = s; q('.ch-comp').dataset.st = s; syncAct(); };
  const syncAct = () => q('.ch-comp').toggleAttribute('data-send', C.st === 'count' || C.st === 'sending' || C.st === 'edit' || (C.st === 'idle' && !!q('.ch-ta').value.trim()));
  const hint = h => { q('.ch-hint .t').innerHTML = h; };
  const showX = on => { q('.ch-x').hidden = !on; };
  const resizeTa = () => { const t = q('.ch-ta'); t.style.height = '56px'; t.style.height = Math.max(56, Math.min(t.scrollHeight, 132)) + 'px'; t.style.overflowY = t.scrollHeight > 132 ? 'auto' : 'hidden'; };
  function drawDict(caret, top) {
    const d = q('.ch-dict');
    d.innerHTML = esc(C.settled) + (C.interim ? `<span class="int">${esc(C.interim)}</span>` : '') + (caret ? '<i class="ch-caret"></i>' : '');
    d.scrollTop = top ? 0 : d.scrollHeight;
  }
  const mkWait = tok => ms => new Promise(r => setTimeout(() => r(tok === C.tok), ms));

  function resetComp() {
    C.tok++; clearInterval(C.tick); clearTimeout(C.edit);
    if (C.ring) { C.ring.onfinish = null; C.ring.cancel(); C.ring = null; }
    C.settled = ''; C.interim = ''; C.voice = false;
    const ta = q('.ch-ta'); ta.value = ''; resizeTa();
    q('.ch-send').classList.remove('done'); q('.ch-dict').innerHTML = '';
    hint(''); showX(false); setSt('idle');
  }

  async function startListen() {
    if (C.st !== 'idle') return;
    const tok = ++C.tok, w = mkWait(tok);
    C.voice = true; C.settled = ''; C.interim = '';
    q('.ch-ta').value = '';
    setSt('listen'); showX(false); hint('<i class="rec"></i>聞いています…'); drawDict(true);
    // shortcut: simulated dictation (timed reveal of DATA.script.ja), not the Web Speech API
    const chunks = DATA.script.ja.match(/[^、。]+[、。]?/g) || [];
    if (!await w(650)) return;
    for (const ch of chunks) {
      for (let i = 0; i < ch.length;) {
        i = Math.min(ch.length, i + 2 + (Math.random() * 2 | 0));
        C.interim = ch.slice(0, i); drawDict(true);
        if (!await w(70 + Math.random() * 60)) return;
      }
      if (!await w(180)) return;
      C.settled += ch; C.interim = ''; drawDict(true);          // interim words settle
      if (!await w(/。$/.test(ch) ? 560 : 280)) return;
    }
    // silence detection: ~1.2s without speech = instruction ended
    setSt('silence'); drawDict(true);
    hint('<span class="ch-sil">…</span><span class="ch-silbar"><i></i></span><span>無音を検出中</span>');
    if (!await w(1200)) return;
    hint(svg('check') + '音声入力が終わりました'); drawDict(false);
    if (!await w(750)) return;
    startCount();
  }
  async function stopListen() {
    const tok = ++C.tok, w = mkWait(tok);
    C.settled += C.interim; C.interim = '';
    if (!C.settled.trim()) return resetComp();
    setSt('silence'); drawDict(false); hint(svg('check') + '音声入力が終わりました');
    if (await w(600)) startCount();
  }
  function startCount() {
    const tok = ++C.tok;
    clearTimeout(C.edit); q('.ch-ta').blur();
    setSt('count'); showX(true); drawDict(false, true);
    if (C.ring) { C.ring.onfinish = null; C.ring.cancel(); }
    const ring = C.ring = q('.ch-ring .pg').animate([{strokeDashoffset: CIRC}, {strokeDashoffset: 0}], {duration: 4000, easing: 'linear', fill: 'forwards'});
    let last = 0;
    const upd = () => {
      const s = Math.max(1, Math.ceil((4000 - ring.currentTime) / 1000));
      if (s === last) return; last = s;
      q('.ch-secs').textContent = s; hint(`<b>${s}</b>秒後に送信 · タップで編集`);
    };
    upd(); clearInterval(C.tick); C.tick = setInterval(upd, 120);
    ring.onfinish = () => { if (tok === C.tok) finishCount(); };
  }
  function finishCount() {
    clearInterval(C.tick); setSt('sending'); showX(false); hint('送信中…');
    q('.ch-send').classList.add('done');            // ring closed -> confirm check pops
    const tok = C.tok;
    setTimeout(() => { if (tok === C.tok) doSend(C.settled); }, 600);
  }
  function toEdit() {
    if (!['listen', 'silence', 'count'].includes(C.st)) return;
    const text = C.settled + C.interim;
    C.tok++; clearInterval(C.tick);
    if (C.ring) { C.ring.onfinish = null; C.ring.cancel(); C.ring = null; }
    const ta = q('.ch-ta'); ta.value = text;

  }
  function doSend(text) {
    text = (text || '').trim();
    if (!text) return resetComp();
    const id = 'm_' + Date.now().toString(36), thread = S.thread;
    let msg;
    if (C.voice && ROLE === 'foreman') {
      msg = {id, thread, from: ME, at: hhmm(), kind: 'voice', ja: text, en: DATA.script.en,
        wk: {stage: 0, due: hhmm(30 * 60000), read: {}, questions: DATA.script.questions, results: {u_rahim: {status: 'wait'}, u_nguyen: {status: 'wait'}, u_siti: {status: 'wait'}}}, tasks: []};
    } else {
      // shortcut: no real machine translation; typed text gets a placeholder counterpart
      msg = {id, thread, from: ME, at: hhmm(), kind: 'text', ja: ROLE === 'foreman' ? text : '（自動翻訳）' + text, en: ROLE === 'foreman' ? '(auto-translated) ' + text : text};
    }
    resetComp();
    Bus.emit('msg:new', {thread, msg});
  }
  function onSend() {
    if (C.st === 'count') { if (C.ring) C.ring.finish(); return; }   // tap = send now (ring snaps closed)
    if (C.st === 'idle' || C.st === 'edit') doSend(q('.ch-ta').value);
  }
  function onMic() {
    if (ROLE === 'worker') return App.toast('Not in prototype');
    if (C.st === 'idle') startListen(); else if (C.st === 'listen') stopListen();
  }

  /* ---------------- read aloud ---------------- */
  function speak(text, btn) {
    const ss = window.speechSynthesis, fail = () => App.toast(T('この端末では読み上げできません', 'Read aloud is not available on this device'));
    if (!ss || !window.SpeechSynthesisUtterance) return fail();
    // shortcut: browser speechSynthesis (voice quality depends on the device); use cloud TTS for production
    if (btn.classList.contains('on')) { ss.cancel(); btn.classList.remove('on'); return; }
    ss.cancel();
    document.querySelectorAll('.ch-spk.on').forEach(b => b.classList.remove('on'));
    const u = new SpeechSynthesisUtterance(text);
    u.lang = ROLE === 'foreman' ? 'ja-JP' : 'en-US'; u.rate = .95;
    let started = false;
    u.onstart = () => { started = true; btn.classList.add('on'); };
    u.onend = () => btn.classList.remove('on');
    u.onerror = () => { btn.classList.remove('on'); if (!started) fail(); };
    ss.speak(u);
    setTimeout(() => { if (!started) { ss.cancel(); btn.classList.remove('on'); fail(); } }, 2500);
  }

  /* ---------------- glossary popover + selection bar ---------------- */
  function closePop() { clearTimeout(S.popT); if (S.pop) { S.pop.remove(); S.pop = null; } }
  function showPop(span) {
    const g = (DATA.glossary || []).find(x => x.ja === span.dataset.g), n = span.closest('.ch-m'); if (!g || !n) return;
    closePop();
    const nr = n.getBoundingClientRect(), k = nr.width / n.offsetWidth || 1, sr = span.getBoundingClientRect();

    if (arr.some(x => x.id === msg.id)) return;
    arr.push(msg);                                   // DATA mutated only here, so both phones stay in step
    if (ROLE === 'foreman' && msg.from === ME && msg.wk) runPipeline(msg.id);
    if (!visible(msg)) return;
    if (msg.from === ME) { if (S.el && S.thread === thread) renderList(true); } else chIncoming(msg);
  });
  Bus.on('wk:stage', ({msgId, stage}) => {
    const m = findMsg(msgId); if (!m || !m.wk) return;
    const was = visible(m);
    m.wk.stage = Math.max(m.wk.stage, stage);
    if (ROLE === 'worker' && !was && visible(m)) chIncoming(m); else refresh(msgId);
  });
  // one confusion row per wrong answer, deduped on user + msgId + term
  function confuse(user, term, msgId) {
    if (!term || DATA.confusions.some(c => c.user === user && c.msgId === msgId && c.term === term)) return;
    DATA.confusions.push({user, term, msgId, at: new Date().toISOString()});
  }
  Bus.on('check:answer', ({msgId, user, answers, status, re, reSel}) => {
    const m = findMsg(msgId); if (!m || !m.wk) return;
    const old = m.wk.results[user] || {};
    if (re) {
      const R = m.wk.re && m.wk.re[user]; if (!R || R.sel !== undefined) return;
      R.sel = reSel;
      const ok = reSel === R.question.answer;
      m.wk.results[user] = {status: ok ? 'green' : old.status || status, answers: old.answers || answers, re: ok ? true : old.re};
      if (!ok) confuse(user, R.question.term || R.topic, msgId + '~re');
    } else {
      m.wk.results[user] = {status, answers};
      answers.forEach((a, i) => { if (a !== m.wk.questions[i].answer) confuse(user, topicOf(m.wk.questions[i]), msgId); });
    }
    refresh(msgId);
  });
  Bus.on('followup:new', f => {
    const arr = DATA.followups || (DATA.followups = []);
    if (arr.some(x => x.id === f.id)) return;
    arr.push(Object.assign({status: 'open'}, f));
    if (ROLE === 'foreman') refresh(f.msgId);
  });
  Bus.on('followup:resolve', ({id, status, note, by, at}) => {
    const f = (DATA.followups || []).find(x => x.id === id); if (!f) return;
    if (f.status === 'understood' || (f.status === 'clarified' && status === 'clarified')) return;   // idempotent, never goes backwards
    f.status = status; if (note) f.note = note; if (by) f.by = by; f.resolvedAt = at;
    if (ROLE === 'foreman') refresh(f.msgId);
  });
  Bus.on('wk:read',({msgId, user, at}) => {
    const m = findMsg(msgId); if (!m || !m.wk) return;
    const rd = m.wk.read || (m.wk.read = {});
    if (rd[user]) return;
    rd[user] = at || hhmm();
    if (ROLE === 'foreman') refresh(msgId);
  });
  Bus.on('wk:nudge', ({msgId, user, at}) => {
    const m = findMsg(msgId); if (!m || !m.wk) return;
    const nd = m.wk.nudged || (m.wk.nudged = {});
    if (nd[user]) return;
    nd[user] = at || hhmm();
    refresh(msgId);
    if (ROLE === 'worker' && user === ME) {
      notify({to: 'worker', title: 'Tanaka is waiting for your answer', body: 'Please answer the quick check' + (m.wk.due ? ' by ' + m.wk.due : ''), push: ['chat', {thread: m.thread}]});
      setTimeout(() => {
        if (!(onChat() && S.thread === m.thread)) return;
        const nb = $('.ch-nb', S.el); nb.innerHTML = `${svg('bell')}<span>Tanaka is waiting for your answer</span>`; nb.hidden = false;
        nb.classList.remove('in'); void nb.offsetWidth; nb.classList.add('in');
        setTimeout(() => { nb.hidden = true; }, 5200);
      }, 0);
    }
  });
  Bus.on('wk:reexplain', p => {
    const m = findMsg(p.msgId); if (!m || !m.wk) return;
    (m.wk.re || (m.wk.re = {}))[p.user] = {ja: p.ja, en: p.en, question: p.question, pics: p.pics || [], topic: p.topic, at: p.at || hhmm()};
    if (ROLE === 'worker') {
      if (p.user !== ME) return;
      if (onChat() && S.thread === m.thread) renderList(true);
      else {
        const th = DATA.threads.find(t => t.id === m.thread); if (th) th.unread = (th.unread || 0) + 1;
        setTimeout(() => App.toast('Tanaka explained again, just for you', {label: 'Open', run: () => { if (onChat()) SCREENS.chat(S.el, {thread: m.thread}); else App.push('chat', {thread: m.thread}); }}), 0);
      }
      return;
    }
    refresh(p.msgId);
    // shortcut: simulated workers answer the re-explain Check themselves (right answer); Rahim only when no real phone is paired
    if (p.user !== 'u_rahim' || !Bus.paired) {
      setTimeout(() => {
        Bus.emit('check:answer', {msgId: p.msgId, user: p.user, answers: (m.wk.results[p.user] || {}).answers || [], status: 'green', re: true, reSel: p.question.answer});
        resolveFu(p.msgId, p.user, 'clarified', 'understood');
      }, 3200);
    }
  });
  Bus.on('ask:foreman', p => {
    const arr = DATA.messages[p.thread] || (DATA.messages[p.thread] = []);
    if (arr.some(x => x.id === p.id)) return;
    const msg = {id: p.id, thread: p.thread, from: p.user, at: p.at || hhmm(), kind: 'ask', ja: p.ja, en: p.en, ask: {ref: p.msgId, topic: p.topic, reply: null}};
    arr.push(msg);
    if (msg.from === ME) { if (S.el && S.thread === p.thread) renderList(true); } else chIncoming(msg, `${first(msg.from)}さんから質問: ${p.ja.slice(0, 16)}`);
  });
  Bus.on('ask:foremanReply', p => {
    const m = findMsg(p.id); if (!m || !m.ask || m.ask.reply) return;
    m.ask.reply = {ja: p.ja, en: p.en, at: p.at || hhmm()};
    refresh(p.id);
    if (ROLE === 'worker' && m.from === ME && !(onChat() && S.thread === m.thread)) {
      const th = DATA.threads.find(t => t.id === m.thread); if (th) th.unread = (th.unread || 0) + 1;
      setTimeout(() => App.toast('Tanaka replied to your question', {label: 'Open', run: () => { if (onChat()) SCREENS.chat(S.el, {thread: m.thread}); else App.push('chat', {thread: m.thread}); }}), 0);
    }
  });
  Bus.on('glossary:add', ({ja, en, reading}) => {
    const g = (DATA.glossary || (DATA.glossary = [])).find(x => x.ja === ja);
    if (g) { g.en = en; g.reading = reading || g.reading; } else DATA.glossary.push({ja, en, reading: reading || ''});
    retext();
  });

  // The foreman phone drives the Wakatta pipeline (one stage per ~900ms) and the simulated workers.
  function runPipeline(id) {
    [1, 2, 3, 4, 5].forEach(s => setTimeout(() => {
      Bus.emit('wk:stage', {msgId: id, stage: s});
      if (s === 3) DATA.script.tasks.forEach((t, k) => Bus.emit('task:update', {task: {id: `t_${id}_${k + 1}`, title: t.title, ja: t.ja, col: 'todo', assignees: t.assignees.slice(), due: t.due, machine: t.machine, from: id}}));
      if (s === 5) simulate(id);
    }, 900 * s));
  }
  function simulate(id) {
    const ans = (u, a) => submit(id, u, a);
    const rd = (u, ms) => setTimeout(() => Bus.emit('wk:read', {msgId: id, user: u, at: hhmm()}), ms);
    rd('u_nguyen', 1200); rd('u_siti', 2400);
    if (!Bus.paired) rd('u_rahim', 2000);
    Object.entries(DATA.script.simulated).forEach(([u, s]) => setTimeout(() => ans(u, s.answers), s.after));
    if (!Bus.paired) setTimeout(() => ans('u_rahim', [1, 1, 2]), 8000);   // standalone: no real Rahim phone
  }
})();

function setupBoard(el) {
  if (el._bd) return; el._bd = 1;
  const strip = $('.bd-strip', el);
  let st = null, raf = 0, suppress = 0;
  const scale = () => el.getBoundingClientRect().width / el.offsetWidth || 1;
  const cols = () => $$('.bd-col', strip);
  const colAt = x => { let best = null, bd = 1e9; cols().forEach(c => { const r = c.getBoundingClientRect(), d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0; if (d < bd) { bd = d; best = c; } }); return best; };
  const place = () => {
    const sr = el.getBoundingClientRect(), k = scale();
    st.g.style.transform = `translate(${(st.x - st.gx - sr.left) / k}px,${(st.y - st.gy - sr.top) / k}px)`;
    const o = colAt(st.x);
    if (o !== st.over) { cols().forEach(c => c.classList.toggle('bd-over', c === o)); st.over = o; }
  };

    if (!st) return;

    st.gx = st.x - r.left; st.gy = st.y - r.top;
    const g = document.createElement('div'); g.className = 'bd-ghost';
    const cl = card.cloneNode(true); cl.classList.remove('bd-new', 'bd-hole'); cl.style.cssText = `width:${card.offsetWidth}px`;
    g.appendChild(cl); el.appendChild(g); st.g = g;

    cols().forEach(c => c.classList.remove('bd-over'));

    const c = e.target.closest('.bd-card');

    if (!st) return;

  strip.addEventListener('contextmenu', e => e.preventDefault());
  el.addEventListener('click', e => {
    if (Date.now() < suppress || e.target.closest('[data-push],[data-open],[data-toast]')) return;
    const c = e.target.closest('.bd-card');
    if (c) App.push('task', {id: c.dataset.id});
  });
}

/* ---------- fake QR (deterministic per machine) ---------- */
function qrSvg(seed) {
  let s = 0; for (const c of seed) s = (s * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296, n = 21;
  let r = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let dark, zone = false;
    for (const [cx, cy] of [[0, 0], [14, 0], [0, 14]]) {
      const lx = x - cx, ly = y - cy;
      if (lx >= -1 && lx <= 7 && ly >= -1 && ly <= 7) { zone = true; dark = lx >= 0 && lx <= 6 && ly >= 0 && ly <= 6 && (lx === 0 || lx === 6 || ly === 0 || ly === 6 || (lx >= 2 && lx <= 4 && ly >= 2 && ly <= 4)); }
    }
    if (!zone) dark = rnd() > .52;
    if (dark) r += `<rect x="${x + 2}" y="${y + 2}" width="1.03" height="1.03"/>`;
  }
  return `<svg viewBox="0 0 25 25" aria-hidden="true"><rect width="25" height="25" class="sf-qrbg"/><g class="sf-qrfg">${r}</g></svg>`;
}

function wireNote(el) {
  if (el._sf) return; el._sf = 1;

    else if (a === 'reread') { N.ph = 'read'; renderNote(); }
    else if (a === 'pick' && !N.fb) {
      const q = qs[N.i], j = +b.dataset.i, ok = j === q.answer;
      N.fb = {sel: j, ok}; N.res[N.i] = ok;
      if (!ok) {

      }
      renderNote();
    } else if (a === 'next') {
      if (N.i < qs.length - 1) { N.i++; N.fb = null; renderNote(true); }
      else { N.ph = N.wrong.length ? 'fail' : 'pass'; renderNote(); if (N.ph === 'pass') N.tm = setTimeout(finishPass, 1400); }
    }
  });

function updSend() { const b = $('.sf-send', NM.el); if (b) b.disabled = !(NM.mid && NM.text.trim().length > 2); }
function setRec(on) {
  const el = NM.el, rec = $('.sf-rec', el); if (!rec) return;

    const s = Math.floor((Date.now() - t0) / 1000); $('.sf-tm', el).textContent = '0:0' + Math.min(9, s);

/* ---------- Bus: shared state ---------- */
function refresh(scroll) {
  Object.keys(R).forEach(id => { const el = scr(id); if (el && el.dataset.lf) R[id](el, false, scroll); });
}
Bus.on('notice:new', ({notice}) => {
  if (!notice || !notice.id) return;
  notice.results = notice.results || {}; notice.answers = notice.answers || {};
  const i = DATA.notices.findIndex(n => n.id === notice.id);
  if (i < 0) DATA.notices.unshift(notice); else DATA.notices[i] = notice;
  rebuild(); refresh();
});
Bus.on('notice:answer', ({id, user, answer, status}) => {
  const n = nOf(id); if (!n) return;
  (n.results = n.results || {})[user] = status; (n.answers = n.answers || {})[user] = answer;
  refresh();
});
Bus.on('ask:new', ({ask}) => {
  if (!ask || !ask.id) return;
  const i = DATA.asks.findIndex(a => a.id === ask.id);
  if (i < 0) DATA.asks.push(ask); else if (DATA.asks[i].status !== 'replied') Object.assign(DATA.asks[i], ask);
  refresh(true);
});
Bus.on('ask:reply', ({id, replyJa, replyEn, by}) => {
  const a = DATA.asks.find(x => x.id === id); if (!a) return;
  Object.assign(a, {status: 'replied', replyJa, replyEn, by: by || 'u_sato'});
  refresh(true);
});
Bus.on('meetup:new', ({meetup}) => {
  if (!meetup || !meetup.id) return;
  const i = DATA.meetups.findIndex(x => x.id === meetup.id);
  if (i < 0) DATA.meetups.push(meetup); else DATA.meetups[i] = meetup;
  const k = mkey(meetup.date); if (S.log.m && S.log.m !== 'all' && !monthsAll().includes(S.log.m)) S.log.m = k;
  refresh();
});

/* ---------- clicks ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-lf]'); if (!el) return;
  const [act, ...rest] = el.dataset.lf.split(':'), arg = rest.join(':');
  switch (act) {
    case 'rem': {
      const ev = DATA.events.find(x => x.id === arg); if (!ev) return;
      const on = !rem.has(arg); on ? rem.add(arg) : rem.delete(arg);
      refresh();
      App.toast(on ? `${t('リマインダーを設定しました', 'Reminder set')}: ${evLabel(ev)}, ${fmtDate(ev.date)} ${ev.time}` : t('リマインダーを解除しました', 'Reminder removed'));
      break;
    }
    case 'speak': speak(el); break;
    case 'play': { el.classList.toggle('play'); setTimeout(() => el.classList.remove('play'), 4000); // shortcut: no audio, animation only
      break; }
    case 'ans': {
      const n = nOf(arg), i = Number(el.dataset.i); if (!n || stOf(n, ME) !== 'wait') return;
      const status = i < 0 ? 'orange' : i === n.q.answer ? 'green' : 'red';
      Bus.emit('notice:answer', {id: n.id, user: ME, answer: i, status});
      if (status !== 'green') notify({to: 'foreman', title: `${short(ME)}: ${ST_JA[status]}`, body: n.titleJa, push: ['notice', {id: n.id}]});
      break;
    }
    case 'orig': S.showJa.has(arg) ? S.showJa.delete(arg) : S.showJa.add(arg); refresh(); break;
    case 'sug': sendAsk(el.dataset.q, 'text'); break;
    case 'send': { const inp = $('.lf-in', scr('ask')); const q = inp.value; inp.value = ''; sendAsk(q, 'text'); break; }
    case 'mic': micAsk(); break;
    case 'reply': {
      const [id, i] = arg.split(':'), a = DATA.asks.find(x => x.id === id), c = CANNED[Number(i)]; if (!a || !c) return;
      Bus.emit('ask:reply', {id, replyJa: c.ja, replyEn: c.en, by: 'u_sato'});
      notify({to: 'worker', title: 'Your Senpai replied', body: c.en, push: ['ask']});
      App.toast('返信しました（作業者には英語で届きます）');
      break;
    }
    case 'nnsrc': S.nn.src = arg; renderNN(); break;
    case 'nnsmp': S.nn.sample = arg; nnRun(S.nn); break;
    case 'nntxt': { const s = SAMPLES.find(x => x.id === arg); S.nn.text = s.textJa; renderNN(); break; }
    case 'nngo': if (!S.nn.text.trim()) { App.toast('文章を入れてください'); return; } S.nn.sample = null; nnRun(S.nn); break;
    case 'nnmic': {
      // shortcut: fake speech, types a canned announcement
      const st = S.nn; st.stage = 'listen'; renderNN();
      setTimeout(() => { if (S.nn !== st) return; st.text = SAMPLES[0].textJa; st.sample = SAMPLES[0].id; nnRun(st); }, 1600);
      break;
    }
    case 'nnev': if (el.tagName === 'INPUT') S.nn.evOn[Number(arg)] = el.checked; break;
    case 'nnreset': S.nn = nnInit(); renderNN(); break;
    case 'nnpost': nnPost(); break;
    case 'meetnew': openMeet(arg); break;
    case 'mk': case 'mw': $$(`[data-lf^="${act}:"]`, el.parentElement).forEach(x => x.classList.toggle('on', x === el)); break;
    case 'meetsave': saveMeet(); break;
    case 'flw': S.log.w = arg; refresh(); break;
    case 'flm': S.log.m = arg; refresh(); break;
    case 'export': openPdf(); break;
    case 'savepdf':
      // shortcut: no real PDF, the preview sheet only. Swap for window.print() with a print stylesheet or a server-side render.
      App.close(); setTimeout(() => App.toast(`support-log-${S.log.m || 'all'}.pdf を保存しました（デモ）`), 260); break;
  }
});
document.addEventListener('input', e => { if (e.target.matches && e.target.matches('[data-lf-text]') && S.nn) S.nn.text = e.target.value; });
document.addEventListener('keydown', e => {

    <div class="row bd-wrap" id="bd-due">${DUES.map(([v, ja, en], i) => `<button class="chip${i ? '' : ' on'}" data-chip data-due="${v}">${t(ja, en)}</button>`).join('')}</div>
    <button class="btn block" id="bd-save">${t('追加', 'Add task')}</button></div>`;
  const first = workers[0]; if (first) body.querySelector(`[data-u="${first}"]`).classList.add('on');
}
build();

body.addEventListener('click', e => {
  const chip = e.target.closest('#bd-asg .chip');
  if (chip) { chip.classList.toggle('on'); return; }
  if (!e.target.closest('#bd-save')) return;
  const input = document.getElementById('bd-title'), title = input.value.trim();
  if (!title) { input.focus(); App.toast(t('タイトルを入力してください', 'Enter a title first')); return; }
  const as = [...body.querySelectorAll('#bd-asg .chip.on')].map(c => c.dataset.u);
  const due = (body.querySelector('#bd-due .chip.on') || {dataset: {}}).dataset.due || '';
  Bus.emit('task:update', {task: {id: 'k' + Date.now().toString(36), title, ja: title, col: 'todo', assignees: as.length ? as : [ME], due, machine: null, from: null}});
  App.close(); input.value = ''; build();
  App.toast(t('タスクを追加しました', 'Task added'));
});
if (window.__wkB) window.__wkB.badge();
})();

/* ===== Part C init: App exists now. Light status bar over the dark camera and the solid Lock/Ready panel ===== */
(() => {
  const bar = document.querySelector('.statusbar'), stage = document.getElementById('stage');
  if (!bar || !stage) return;
  let mine = false;
  const sync = () => {
    const top = App.stack[App.stack.length - 1], want = top === 'scan' || top === 'panel';
    if (want && !bar.classList.contains('light')) { bar.classList.add('light'); mine = true; }
    else if (!want && mine) { bar.classList.remove('light'); mine = false; }
  };
  new MutationObserver(sync).observe(stage, {subtree: true, attributes: true, attributeFilter: ['class']});
  sync();
})();


/* ===== Part E init: runs after App exists ===== */
(() => {
if (window.uxBoot) window.uxBoot();
// onboarding is NOT shown by default (it would get in the way of other tests): only with ?onboard=1, or Me -> Replay onboarding
if (QS.has('onboard')) setTimeout(() => window.uxOpenOnboarding && window.uxOpenOnboarding(), 700);
})();

</script>
</body>
</html>
