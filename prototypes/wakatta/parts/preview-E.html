<!doctype html>
<!-- data-platform: "android" (Material 3, default) or "ios" -->
<html lang="en" data-platform="android">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fef7ff">
<title>Wakatta? — workplace chat</title>
<style>
/* ===== Tokens ===== */
:root{
  --bg:#fef7ff;--surface:#fef7ff;--surface-1:#f7f2fa;--surface-2:#f3edf7;--surface-3:#ece6f0;
  --on:#1d1b20;--on-2:#49454f;--outline:#79747e;--outline-2:#cac4d0;
  --primary:#6750a4;--on-primary:#fff;--primary-c:#eaddff;--on-primary-c:#21005d;
  --error:#b3261e;--scrim:rgba(0,0,0,.32);
  --font:Roboto,"Google Sans",system-ui,sans-serif;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:28px;
  --ease:cubic-bezier(.2,0,0,1);--ease-out:cubic-bezier(.05,.7,.1,1);--dur:400ms;
  --status-h:36px;--nav-h:24px;
}
[data-platform=ios]{
  --bg:#f2f2f7;--surface:#fff;--surface-1:#fff;--surface-2:#fff;--surface-3:#e5e5ea;
  --on:#000;--on-2:#8e8e93;--outline:#c6c6c8;--outline-2:#e5e5ea;
  --primary:#007aff;--on-primary:#fff;--primary-c:#e5f0ff;--on-primary-c:#007aff;
  --error:#ff3b30;--scrim:rgba(0,0,0,.4);
  --font:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r-s:8px;--r-m:10px;--r-l:12px;--r-xl:14px;
  --ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.32,.72,0,1);--dur:500ms;
  --status-h:54px;--nav-h:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:#e4e4e7;font:16px/1.4 var(--font);color:var(--on);user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;user-select:text}

/* ===== Device frame (desktop) / full screen (real phone) ===== */
.device{position:relative;width:412px;height:892px;border-radius:48px;border:12px solid #111;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25);isolation:isolate}
@media (max-width:520px),(pointer:coarse) and (max-width:1024px){
  body{background:var(--bg)}
  .device{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none!important}
  :root,[data-platform=ios]{--status-h:env(safe-area-inset-top,0px);--nav-h:env(safe-area-inset-bottom,0px)}
}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--status-h);z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:500;pointer-events:none}
[data-platform=ios] .statusbar{font-weight:600;font-size:16px;padding:6px 34px 0}
.statusbar.light{color:#fff}
.gesturebar{position:absolute;bottom:8px;left:50%;width:108px;height:4px;margin-left:-54px;border-radius:4px;background:var(--on);opacity:.85;z-index:900;pointer-events:none}
[data-platform=ios] .gesturebar{width:134px;margin-left:-67px;height:5px}

/* ===== Screens ===== */
.stage{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:var(--status-h);will-change:transform,opacity}
.screen.active,.screen.leaving{display:flex}
.screen[data-root]{padding-bottom:calc(80px + var(--nav-h))}
[data-platform=ios] .screen[data-root]{padding-bottom:calc(50px + var(--nav-h))}
.screen.full{padding-top:0}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(16px + var(--nav-h))}
.content::-webkit-scrollbar{display:none}
.pad{padding:0 16px}

/* ===== Top app bar ===== */
.appbar{display:flex;align-items:center;gap:4px;min-height:64px;padding:0 4px;flex-shrink:0;transition:background .2s}
.appbar h1{flex:1;margin:0 0 0 12px;font-size:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.scrolled{background:var(--surface-2)}
.appbar.large{flex-wrap:wrap;min-height:112px;align-content:space-between;padding-bottom:20px}
.appbar.large h1{flex-basis:100%;order:9;font-size:28px;margin-left:12px}
[data-platform=ios] .appbar{min-height:44px;padding:0 8px;justify-content:space-between}
[data-platform=ios] .appbar h1{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0}
[data-platform=ios] .appbar.large h1{flex:0 0 100%;text-align:left;font-size:34px;font-weight:700;margin-left:8px}
[data-platform=ios] .appbar.large{min-height:96px;padding-bottom:8px}
[data-platform=ios] .appbar.scrolled{background:rgba(249,249,249,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--outline)}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;flex-shrink:0}
.icon-btn svg,.ic{width:24px;height:24px;fill:currentColor}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:.1px;position:relative;overflow:hidden;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.outlined{background:none;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.block{display:flex;width:100%}
[data-platform=ios] .btn{height:50px;border-radius:var(--r-m);font-size:17px;font-weight:600}
.fab{position:absolute;right:16px;bottom:calc(16px + var(--nav-h));z-index:5;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--primary-c);color:var(--on-primary-c);box-shadow:0 3px 8px rgba(0,0,0,.18);overflow:hidden}
.screen[data-root] .fab{bottom:calc(96px + var(--nav-h))}
.card{background:var(--surface-1);border-radius:var(--r-m);overflow:hidden;position:relative}
.card.outlined{background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-2)}
.list{margin:0;padding:0;list-style:none}
.list-item{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;position:relative;overflow:hidden}
.list-item .grow{flex:1;min-width:0}
.list-item .sub{font-size:14px;color:var(--on-2)}
[data-platform=ios] .list{background:var(--surface);border-radius:var(--r-m);margin:0 16px}
[data-platform=ios] .list-item{min-height:44px}
[data-platform=ios] .list-item+.list-item::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--outline)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-weight:500;flex-shrink:0;object-fit:cover}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:8px;font-size:14px;box-shadow:inset 0 0 0 1px var(--outline);position:relative;overflow:hidden;white-space:nowrap}
.chip.on{background:var(--primary-c);color:var(--on-primary-c);box-shadow:none}
[data-platform=ios] .chip{border-radius:16px;box-shadow:none;background:var(--surface-3)}
.row{display:flex;gap:8px;align-items:center}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{scroll-snap-align:start;flex-shrink:0}
.field{display:block;width:100%;height:56px;padding:0 16px;border-radius:4px;border:1px solid var(--outline);background:none;outline:none}
.field:focus{border:2px solid var(--primary);padding:0 15px}
[data-platform=ios] .field{height:44px;border:0;border-radius:var(--r-m);background:var(--surface)}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--outline);position:relative;transition:background .2s;flex-shrink:0;margin:0}
.switch::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .25s var(--ease)}
.switch:checked{background:var(--primary);box-shadow:none}
.switch:checked::after{left:24px;top:4px;width:24px;height:24px;background:var(--on-primary)}
[data-platform=ios] .switch{width:51px;height:31px;box-shadow:none;background:#e9e9ea}
[data-platform=ios] .switch::after{top:2px;left:2px;width:27px;height:27px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
[data-platform=ios] .switch:checked{background:#34c759}
[data-platform=ios] .switch:checked::after{left:22px;top:2px;width:27px;height:27px}
.skeleton{background:linear-gradient(90deg,var(--surface-3) 0,var(--surface-1) 50%,var(--surface-3) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:var(--r-s)}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--primary-c);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stagger>*{animation:rise .45s var(--ease-out) both}
.stagger>*:nth-child(2){animation-delay:40ms}.stagger>*:nth-child(3){animation-delay:80ms}.stagger>*:nth-child(4){animation-delay:120ms}.stagger>*:nth-child(5){animation-delay:160ms}.stagger>*:nth-child(n+6){animation-delay:200ms}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ===== Press feedback ===== */
.ripple-ink{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);pointer-events:none;animation:ink .5s var(--ease) forwards}
@keyframes ink{to{transform:scale(1);opacity:0}}
[data-platform=ios] [data-tap]:active,[data-platform=ios] .btn:active,[data-platform=ios] .list-item:active,[data-platform=ios] .icon-btn:active{opacity:.4;transition:opacity 0s}
[data-platform=ios] .btn,[data-platform=ios] .list-item,[data-platform=ios] .icon-btn{transition:opacity .25s}

/* ===== Bottom navigation / tab bar ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;height:calc(80px + var(--nav-h));padding-bottom:var(--nav-h);background:var(--surface-2);transition:transform .3s var(--ease)}
.tabbar.hidden{transform:translateY(100%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--on-2)}
.tab .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .25s}
.tab.on{color:var(--on)}
.tab.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
[data-platform=ios] .tabbar{height:calc(50px + var(--nav-h));background:rgba(249,249,249,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--outline)}
[data-platform=ios] .tab{font-size:10px;gap:2px}
[data-platform=ios] .tab .pill{width:auto;height:auto;background:none!important}
[data-platform=ios] .tab.on{color:var(--primary)}

/* ===== Overlays: sheet, dialog, snackbar ===== */
.scrim{position:absolute;inset:0;z-index:600;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:700;max-height:90%;display:flex;flex-direction:column;background:var(--surface-1);border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:var(--nav-h);transform:translateY(105%);visibility:hidden}
.sheet .grip{flex-shrink:0;padding:16px 0 12px;touch-action:none}
.sheet .grip::before{content:"";display:block;margin:auto;width:32px;height:4px;border-radius:2px;background:var(--outline)}
.sheet .body{overflow-y:auto;padding:0 16px 16px}
[data-platform=ios] .sheet .grip::before{width:36px;height:5px;background:#c7c7cc}
.dialog{position:absolute;left:50%;top:50%;z-index:700;width:min(312px,85%);margin:0;background:var(--surface-3);border-radius:var(--r-xl);padding:24px;transform:translate(-50%,-50%);visibility:hidden;opacity:0}
.dialog h2{margin:0 0 16px;font-size:24px;font-weight:400}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
[data-platform=ios] .dialog{width:270px;padding:20px 16px 0;text-align:center;background:rgba(242,242,242,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
[data-platform=ios] .dialog h2{font-size:17px;font-weight:600;margin-bottom:4px}
[data-platform=ios] .dialog .actions{margin:20px -16px 0;gap:0;border-top:.5px solid var(--outline)}
[data-platform=ios] .dialog .actions .btn{flex:1;background:none;color:var(--primary);font-weight:400;height:44px;border-radius:0}
[data-platform=ios] .dialog .actions .btn+.btn{border-left:.5px solid var(--outline);font-weight:600}
.snackbar{position:absolute;left:16px;right:16px;bottom:calc(16px + var(--nav-h));z-index:800;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-radius:4px;background:#322f35;color:#f5eff7;font-size:14px;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .3s var(--ease-out),opacity .2s}
.snackbar.on{transform:none;opacity:1;pointer-events:auto}
.has-tabs .snackbar{bottom:calc(96px + var(--nav-h))}
[data-platform=ios] .snackbar{top:calc(var(--status-h) + 8px);bottom:auto;border-radius:24px;justify-content:center;background:rgba(30,30,30,.9);transform:translateY(-120%)}
[data-platform=ios] .snackbar.on{transform:none}

/* ===== Pull to refresh ===== */
.ptr{height:0;display:grid;place-items:center;overflow:visible;position:relative;z-index:2}
.ptr .spinner{position:absolute;top:0;opacity:0;transform:translateY(-40px)}

/* ===== Embedded in index.html (two phones): keep status bar, host draws the bezel ===== */
html.embed{--status-h:36px;--nav-h:24px}
html.embed body{background:transparent}
html.embed .device{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
html.embed .statusbar{display:flex!important}
/* ===== Wakatta status colors ===== */
:root{--ok:#1e8e3e;--ok-c:#ceead6;--warn:#e37400;--warn-c:#feefc3;--bad:#d93025;--bad-c:#fad2cf;--wait:#9aa0a6}
/* ===== Part A: chat screen + Wakatta card (ch- / wk-) ===== */
.screen[data-screen=chat]{font-family:Roboto,"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
.screen[data-screen=chat] .ic{flex-shrink:0}
.ch-bar{gap:2px;min-height:60px}
.ch-t{flex:1;min-width:0;margin-left:4px}
.ch-t b{display:block;font-size:18px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-t span{display:block;font-size:12px;color:var(--on-2)}
.ch-mem{display:flex;padding:0 14px 0 8px}
.ch-mem .avatar{width:28px;height:28px;font-size:12px;color:#fff;margin-left:-8px;box-shadow:0 0 0 2px var(--bg)}

.ch-list{display:flex;flex-direction:column;gap:14px;padding:8px 12px 16px}
.ch-m{display:flex;flex-direction:column;min-width:0}
.ch-m.own{align-items:flex-end}
.ch-m.oth{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:8px}
.ch-av{width:36px;height:36px;font-size:14px;color:#fff;align-self:start}
.ch-col{min-width:0;display:flex;flex-direction:column;align-items:flex-start}
.ch-nm{font-size:12px;color:var(--on-2);margin:0 0 2px 4px}
.ch-bub{max-width:88%;padding:10px 14px;border-radius:20px;background:var(--surface-2);font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.own .ch-bub{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px}
.oth .ch-bub{border-top-left-radius:6px}
.ch-meta{font-size:11px;color:var(--on-2);margin:3px 6px 0}
.ch-new{animation:ch-in .4s var(--ease-out) both}
.own.ch-new{transform-origin:right bottom}
@keyframes ch-in{from{opacity:0;transform:translateY(28px) scale(.95)}}
.ch-vt{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12px;opacity:.9}
.ch-vt .ic{width:16px;height:16px}
.ch-bars{display:flex;align-items:center;gap:2px;height:16px}
.ch-bars i{width:2px;border-radius:1px;background:currentColor;height:var(--h);opacity:.8}
.ch-orig-b{align-self:flex-start;min-height:36px;margin:2px 0 0 4px;padding:0 4px;font-size:13px;color:var(--primary);position:relative}
.ch-orig-b::after{content:"";position:absolute;inset:-6px -8px}
.ch-orig{margin-top:2px;padding:8px 12px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);font-size:15px;line-height:1.5}
.ch-fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .32s var(--ease);width:100%}
.ch-fold.open{grid-template-rows:1fr}
.ch-fold>div{overflow:hidden;min-height:0}

/* --- Wakatta card (foreman) --- */
.ch-wk{width:100%;margin-top:6px;border-radius:20px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--outline-2);overflow:hidden}
.ch-pill{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:0 10px 0 14px;position:relative;overflow:hidden;font-size:13.5px;color:var(--on-2);text-align:left;transition:background .15s}
.ch-pill:active{background:var(--surface-3)}
.ch-pt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-pt b{color:var(--on);font-weight:500}
.ch-spin{width:16px;height:16px;border-width:2.5px;flex-shrink:0}
.ch-dots{display:flex;gap:5px;flex-shrink:0}
.ch-dot{width:14px;height:14px;border-radius:50%;background:var(--wait)}
.ch-dot.wait{background:none;box-shadow:inset 0 0 0 2px var(--wait)}
.ch-dot.green{background:var(--ok)}.ch-dot.orange{background:var(--warn)}.ch-dot.red{background:var(--bad)}
.ch-dot.pop{animation:ch-pop .5s var(--ease-out)}
@keyframes ch-pop{0%{transform:scale(.3)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.ch-chev{display:grid;width:28px;height:28px;place-items:center;transition:transform .3s var(--ease);flex-shrink:0}
.ch-wk.open .ch-chev{transform:rotate(180deg)}
.ch-prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--primary);transform-origin:left;transform:scaleX(0);transition:transform .8s linear}
.ch-bd{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--on)}
.ch-h{font-size:12px;font-weight:500;letter-spacing:.4px;color:var(--on-2);margin-top:6px}
.ch-steps{display:grid;grid-template-columns:1fr 1fr;gap:8px 8px;list-style:none;margin:0;padding:0}
.ch-steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--on-2)}
.ch-steps li.done{color:var(--on)}
.ch-tick{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);flex-shrink:0;color:#fff}
.ch-tick .ic{width:12px;height:12px}
.done .ch-tick{background:var(--ok)}
.ch-tick .spinner{width:14px;height:14px;border-width:2px}
.ch-q{display:flex;gap:10px;padding:10px 12px;background:var(--surface);border-radius:12px}
.ch-qn{width:24px;height:24px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);font-size:12px;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.ch-qt{font-size:14px;line-height:1.4}
.ch-opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ch-op{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;background:var(--surface-3);color:var(--on-2)}
.ch-op.ok{background:var(--ok-c);color:#0b4d1f;font-weight:500}
.ch-op .ic{width:14px;height:14px}
.ch-term{display:inline-flex;gap:6px;align-items:center;margin-top:6px;padding:4px 10px;border-radius:8px;background:var(--primary-c);color:var(--on-primary-c);font-size:12px}
.ch-wr{display:flex;align-items:center;gap:10px;min-height:44px}
.ch-wr .avatar{width:32px;height:32px;font-size:13px;color:#fff}
.ch-wr .nm{flex:1;min-width:0;font-size:14px;line-height:1.25}
.ch-mks{display:flex;gap:8px;margin-top:2px}
.ch-mk{display:inline-flex;align-items:center;gap:1px;font-size:12px;color:var(--on-2)}
.ch-mk .ic{width:14px;height:14px}
.ch-mk.ok .ic{color:var(--ok)}.ch-mk.no .ic{color:var(--bad)}
.ch-st{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:13px;font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0}
.ch-st.green{background:var(--ok-c);color:#0b4d1f}.ch-st.orange{background:var(--warn-c);color:#5c3200}
.ch-st.red{background:var(--bad-c);color:#7a0f08}.ch-st.wait{background:var(--surface-3);color:var(--on-2)}
.ch-st.pop{animation:ch-pop .5s var(--ease-out)}
.ch-again{margin:-2px 0 2px 42px;align-self:flex-start;height:36px;padding:0 14px;font-size:13px}

/* --- Check card (worker) --- */
.ch-chk{width:100%;margin-top:8px;padding:12px 12px 14px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-2)}
.ch-chk:empty{display:none}
.ch-chk-h{display:flex;align-items:center;gap:8px;font-size:14px}
.ch-chk-h .ic{color:var(--primary)}
.ch-chk-h span{color:var(--on-2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.ch-chk-h b{white-space:nowrap}
.ch-pd{display:flex;gap:5px}
.ch-pd i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--outline)}
.ch-pd i.cur{background:var(--primary);box-shadow:none}
.ch-pd i.ok{background:var(--ok);box-shadow:none}.ch-pd i.no{background:var(--bad);box-shadow:none}
.ch-cq.ch-slide{animation:ch-slide .32s var(--ease-out) both}
@keyframes ch-slide{from{opacity:0;transform:translateX(28px)}}
.ch-cqn{margin-top:12px;font-size:12px;color:var(--on-2)}
.ch-cqt{margin-top:2px;font-size:16px;font-weight:500;line-height:1.4}
.ch-or{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--outline-2);font-size:16px;text-align:left;margin-top:8px;transition:opacity .25s,background .2s}
.ch-or:active{background:var(--surface-3)}
.ch-or .ic{margin-left:auto;width:22px;height:22px}
.ch-or.ns{color:var(--on-2);font-size:15px}
.ch-or.ok{background:var(--ok-c);box-shadow:inset 0 0 0 2px var(--ok);color:#0b4d1f;animation:ch-ok .4s var(--ease-out)}
.ch-or.bad{background:var(--bad-c);box-shadow:inset 0 0 0 2px var(--bad);color:#7a0f08;animation:ch-shake .4s}
.ch-or.dim{opacity:.45}
.ch-chk.fb .ch-or{pointer-events:none}
@keyframes ch-ok{0%{transform:scale(.97)}60%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes ch-shake{0%,100%{transform:none}20%{transform:translateX(-6px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.ch-fbt{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:14px;font-weight:500;animation:ch-slide .3s var(--ease-out) both}
.ch-fbt.ok{color:var(--ok)}.ch-fbt.bad{color:var(--bad)}
.ch-res{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;animation:ch-ok .5s var(--ease-out)}
.ch-res .ic{width:34px;height:34px}
.ch-res b{display:block;font-size:18px;line-height:1.2}
.ch-res span{font-size:13px;opacity:.85}
.ch-res.green{background:var(--ok-c);color:#0b4d1f}.ch-res.orange{background:var(--warn-c);color:#5c3200}.ch-res.red{background:var(--bad-c);color:#7a0f08}
.ch-tk{margin-top:12px;font-size:12px;color:var(--on-2);display:flex;align-items:center;gap:6px}
.ch-tk .ic{width:16px;height:16px;color:var(--ok)}
.ch-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ch-chips button{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:10px;background:var(--primary-c);color:var(--on-primary-c);font-size:13px;text-align:left}
.ch-ask{margin-top:8px;height:40px;font-size:13px}

/* --- Composer --- */
.ch-comp{flex-shrink:0;padding:4px 12px calc(10px + var(--nav-h));background:var(--surface-1);border-top:1px solid var(--outline-2);position:relative;z-index:3}
.ch-hintw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s var(--ease)}
.ch-comp:not([data-st=idle]) .ch-hintw{grid-template-rows:1fr}
.ch-hintw>div{overflow:hidden;min-height:0}
.ch-hint{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 4px;font-size:13px;color:var(--on-2)}
.ch-hint .t{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.ch-hint .t b{color:var(--on);font-weight:700;display:inline-block;min-width:.6em;text-align:center}
.ch-hint .t .ic{width:18px;height:18px;color:var(--ok)}
.ch-hint .rec{display:inline-block;flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--bad);animation:ch-blink 1s steps(2) infinite}
.ch-sil{font-size:20px;line-height:1;letter-spacing:2px;animation:ch-blink 1.2s steps(2) infinite}
.ch-silbar{flex:0 0 56px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.ch-silbar i{display:block;height:100%;background:var(--outline);transform-origin:left;animation:ch-fill 1.2s linear both}
@keyframes ch-fill{from{transform:scaleX(0)}}
.ch-x{position:relative;height:32px;padding:0 12px 0 8px;border-radius:16px;display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);font-size:13px;font-weight:500;color:var(--on)}
.ch-x::after{content:"";position:absolute;inset:-8px -4px}
.ch-x .ic{width:18px;height:18px}
.ch-x[hidden]{display:none}
.ch-row{display:flex;align-items:flex-end;gap:10px}
.ch-field{flex:1;min-width:0;background:var(--surface-3);border-radius:28px;padding:0 18px;min-height:56px;display:flex;flex-direction:column;justify-content:center;transition:background .3s}
.ch-comp[data-st=listen] .ch-field,.ch-comp[data-st=silence] .ch-field{background:var(--primary-c)}
.ch-ta{display:block;overflow-y:hidden;width:100%;border:0;outline:0;background:none;resize:none;height:56px;max-height:132px;padding:15px 0;line-height:26px;font-size:16px;color:var(--on)}
.ch-ta::placeholder{color:var(--on-2)}
.ch-dict,.ch-wave{display:none}
.ch-dict{max-height:154px;overflow-y:auto;padding:12px 0 14px;font-size:16px;line-height:1.6;scrollbar-width:none;cursor:text;word-break:break-all}
.ch-dict::-webkit-scrollbar{display:none}
.ch-dict .int{color:var(--on-2);opacity:.7}
.ch-caret{display:inline-block;width:2px;height:1.15em;margin-left:1px;vertical-align:text-bottom;background:var(--primary);animation:ch-blink 1s steps(2) infinite}
@keyframes ch-blink{50%{opacity:0}}
.ch-wave{align-items:center;justify-content:space-between;height:30px;padding-top:12px}
.ch-wave i{width:3px;height:22px;border-radius:2px;background:var(--primary);transform:scaleY(.14)}
.ch-comp[data-st=listen] .ch-wave i{animation:ch-wv var(--d,.7s) ease-in-out infinite alternate}
@keyframes ch-wv{from{transform:scaleY(.14)}to{transform:scaleY(var(--m,1))}}
.ch-comp:is([data-st=listen],[data-st=silence],[data-st=count],[data-st=sending]) .ch-dict{display:block}
.ch-comp:is([data-st=listen],[data-st=silence]) .ch-wave{display:flex}
.ch-comp:is([data-st=listen],[data-st=silence],[data-st=count],[data-st=sending]) .ch-ta{display:none}
.ch-act{position:relative;width:56px;height:56px;flex-shrink:0;margin-bottom:0}
.ch-mic,.ch-send{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .28s var(--ease-out),opacity .2s}
.ch-mic .ic{width:28px;height:28px}
.ch-mic::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--bad);opacity:0;pointer-events:none}
.ch-comp[data-st=listen] .ch-mic{background:var(--bad)}
.ch-comp[data-st=listen] .ch-mic::before{animation:ch-pulse 1.3s ease-out infinite}
.ch-comp[data-st=silence] .ch-mic{background:var(--outline);box-shadow:none}
@keyframes ch-pulse{from{opacity:.45;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.ch-send{transform:scale(.4);opacity:0;pointer-events:none}
.ch-comp[data-send] .ch-mic{transform:scale(.4);opacity:0;pointer-events:none}
.ch-comp[data-send] .ch-send{transform:none;opacity:1;pointer-events:auto}
.ch-ring{position:absolute;left:-6px;top:-6px;width:68px;height:68px;transform:rotate(-90deg);pointer-events:none;opacity:0;transition:opacity .2s}
.ch-comp:is([data-st=count],[data-st=sending]) .ch-ring{opacity:1}
.ch-ring circle{fill:none;stroke-width:4}
.ch-ring .tr{stroke:var(--primary-c)}
.ch-ring .pg{stroke:var(--primary);stroke-linecap:round;stroke-dasharray:188.5;stroke-dashoffset:188.5}
.ch-secs{position:absolute;top:-10px;right:-10px;min-width:22px;height:22px;padding:0 4px;border-radius:11px;background:var(--on);color:var(--bg);font-size:12px;font-weight:700;display:none;place-items:center}
.ch-comp[data-st=count] .ch-secs{display:grid}
.ch-ok{position:absolute;inset:0;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;transform:scale(0);opacity:0}
.ch-send.done .ch-ok{animation:ch-okpop .45s var(--ease-out) forwards}
@keyframes ch-okpop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
.ch-fold>div{visibility:hidden;transition:visibility 0s .32s}
.ch-fold.open>div{visibility:visible;transition-delay:0s}

/* ===== Part A additions: bubbles, glossary, re-explain, ask, read/nudge, sheets ===== */
.ch-m{position:relative}
.ch-brow{display:flex;align-items:flex-end;gap:2px;max-width:100%;min-width:0}
.ch-m.own .ch-brow{justify-content:flex-end}
.ch-brow .ch-bub{flex:0 1 auto;max-width:calc(100% - 38px)}
.ch-spk{position:relative;flex-shrink:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--on-2);transition:background .15s,color .15s,transform .15s}
.ch-spk::after{content:"";position:absolute;inset:-7px}
.ch-spk .ic{width:18px;height:18px}
.ch-spk:active{background:var(--surface-3)}
.ch-spk.on{color:var(--primary);background:var(--primary-c);animation:ch-spkp 1s ease-in-out infinite alternate}
@keyframes ch-spkp{to{transform:scale(1.12)}}
.ch-tx{white-space:pre-wrap}
.own .ch-tx{user-select:text;-webkit-user-select:text}
.ch-g{text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:var(--primary);cursor:pointer;border-radius:2px}
.own .ch-bub .ch-g{text-decoration-color:currentColor}
.ch-pop{position:absolute;z-index:5;width:228px;padding:10px 14px 12px;border-radius:14px;background:var(--surface-3);color:var(--on);box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 0 0 1px var(--outline-2);animation:ch-pin .2s var(--ease-out) both}
@keyframes ch-pin{from{opacity:0;transform:translateY(6px) scale(.96)}}
.ch-pj{font-size:18px;font-weight:500;display:flex;align-items:baseline;gap:8px}
.ch-pj span{font-size:12px;font-weight:400;color:var(--on-2)}
.ch-pe{font-size:16px;margin-top:2px}
.ch-pl{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 8px 3px 6px;border-radius:10px;background:var(--primary-c);color:var(--on-primary-c);font-size:12px}
.ch-pl .ic{width:14px;height:14px}
.ch-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch-due{display:inline-flex;align-items:center;gap:3px;padding:1px 8px 1px 5px;border-radius:9px;background:var(--surface-3);color:var(--on-2);font-size:11px}
.ch-due .ic,.ch-dl .ic{width:13px;height:13px}
.ch-dl{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--on-2)}
.ch-rd{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--on-2)}
.ch-rd.on{color:var(--primary)}
.ch-rd .ic{width:14px;height:14px}
.ch-ret,.ch-fu{display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:500;white-space:nowrap}
.ch-ret{background:var(--ok-c);color:#0b4d1f;animation:ch-pop .5s var(--ease-out)}
.ch-ret .ic{width:12px;height:12px}
.ch-fu.open{background:var(--bad-c);color:#7a0f08}.ch-fu.clarified{background:var(--warn-c);color:#5c3200}.ch-fu.understood{background:var(--ok-c);color:#0b4d1f}
.ch-mks{flex-wrap:wrap;align-items:center}
.ch-wa{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-2px 0 2px 42px}
.ch-wa .ch-again{margin:0}
.ch-again .ic,.ch-ask .ic,.ch-gchip .ic{width:18px;height:18px}
.ch-ract{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 12px 0 8px;border-radius:16px;background:var(--surface-3);color:var(--on-2);font-size:13px}
.ch-ract .ic{width:16px;height:16px}.ch-ract.no{background:var(--bad-c);color:#7a0f08}
.ch-gchip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px 0 10px;border-radius:12px;background:var(--surface-3);font-size:13px;font-weight:500}
.ch-nd{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 12px;border-radius:12px;background:var(--warn-c);color:#5c3200;font-size:13px;animation:ch-slide .3s var(--ease-out) both}
.ch-nd .ic{width:18px;height:18px}
.ch-cqn{display:flex;align-items:center;gap:8px}
.ch-asktxt{display:inline-flex;align-items:center;gap:6px;min-height:44px;margin-top:6px;padding:0 6px;color:var(--primary);font-size:14px;font-weight:500}
.ch-asktxt .ic{width:20px;height:20px}
.ch-nsp{margin-top:10px;padding:12px;border-radius:14px;background:var(--primary-c);color:var(--on-primary-c);font-size:14px;animation:ch-slide .3s var(--ease-out) both}
.ch-nsp>div{display:flex;align-items:center;gap:8px;margin-top:8px}
.ch-nsp .btn{height:44px;padding:0 18px}.ch-nsp .btn .ic{width:20px;height:20px}
.ch-nsp .btn.text{color:var(--on-primary-c)}
.ch-next{margin-top:10px;height:48px;width:100%}
.ch-exp{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 3px 0 0 var(--warn);font-size:14px;line-height:1.5;animation:ch-slide .3s var(--ease-out) both}
.ch-expt{display:flex;align-items:center;gap:6px;margin-bottom:2px;font-size:12px;font-weight:500;color:var(--on-2)}
.ch-expt .ic{width:16px;height:16px}
.ch-expg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;padding:6px 10px;border-radius:10px;background:var(--primary-c);color:var(--on-primary-c);font-size:14px}
.ch-expg .ic{width:16px;height:16px}.ch-expg i{font-style:normal;font-size:12px;opacity:.8}
.ch-expg span{margin-left:auto;font-size:11px;opacity:.85}

/* re-explain bubble (worker) */
.ch-rxb{display:flex;flex-direction:column;align-items:flex-start;width:100%}
.ch-rxt{display:flex;align-items:center;gap:6px;margin:0 0 4px 4px;font-size:12px;color:var(--primary);font-weight:500}
.ch-rxt .ic{width:14px;height:14px}
.ch-rxbub{max-width:100%;width:100%;background:var(--primary-c);color:var(--on-primary-c);border-top-left-radius:6px;position:relative;padding-right:44px}
.ch-rxbub .ch-spk{position:absolute;right:6px;top:6px;color:var(--on-primary-c)}
.ch-rjp{margin-top:8px;padding-top:8px;border-top:1px solid color-mix(in srgb,currentColor 20%,transparent);font-size:14px;opacity:.85;white-space:pre-line}
.ch-pics{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.ch-pi{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:48px;padding:6px 8px;border-radius:12px;background:var(--surface);color:var(--on);box-shadow:inset 0 0 0 1px var(--outline-2)}
.ch-pi .ic{width:26px;height:26px;color:var(--primary)}
.ch-pi em{font-style:normal;font-size:11px;color:var(--on-2)}
.ch-pa .ic{width:20px;height:20px;color:var(--on-2)}
.ch-rck{width:100%;margin-top:8px;padding:12px;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--outline-2)}
.ch-rck .ch-cqn{margin-top:0}
.ch-rck.fb .ch-or{pointer-events:none}

/* ask: quoted question + reply */
.ch-quote{display:flex;flex-direction:column;gap:1px;margin:0 0 6px;padding:4px 10px;border-radius:4px 10px 10px 4px;border-left:3px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent);font-size:12.5px;line-height:1.35}
.ch-quote i{font-style:normal;opacity:.8}
.ch-ar:empty{display:none}
.ch-ar{margin-top:6px;max-width:100%}
.ch-areply{height:44px;padding:0 18px 0 14px}.ch-areply .ic{width:20px;height:20px}
.ch-rep{position:relative;max-width:88%;padding:8px 40px 8px 12px;border-radius:16px;background:var(--surface-3);font-size:15px;line-height:1.45;animation:ch-in .35s var(--ease-out) both}
.ch-rep b{display:block;font-size:11.5px;font-weight:500;color:var(--on-2);margin-bottom:1px}
.ch-rep .ch-spk{position:absolute;right:2px;top:4px}
.ch-rep.own{margin-left:auto;background:var(--primary);color:var(--on-primary);padding-right:12px}.ch-rep.own b{color:inherit;opacity:.8}
.ch-aw{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--on-2)}.ch-aw .ic{width:16px;height:16px}
.ch-m.own .ch-ar{display:flex;flex-direction:column;align-items:flex-start}

/* nudge banner + selection bar */
.ch-nb{display:flex;align-items:center;gap:10px;margin:0 12px;padding:10px 14px;border-radius:14px;background:var(--warn-c);color:#5c3200;font-size:14px;font-weight:500;z-index:4}
.ch-nb[hidden]{display:none}
.ch-nb.in{animation:ch-drop .4s var(--ease-out) both}
.ch-nb .ic{width:20px;height:20px}
@keyframes ch-drop{from{opacity:0;transform:translateY(-16px)}}
.ch-selbar{display:none;flex-shrink:0;justify-content:center;padding:6px 12px 0;background:var(--surface-1)}
.ch-selbar.on{display:flex;animation:ch-slide .25s var(--ease-out) both}
.ch-selbar .btn{height:44px;padding:0 18px 0 14px}.ch-selbar .btn .ic{width:20px;height:20px}

/* sheets */
.ch-sb{padding-bottom:0!important}
.ch-sh-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ch-sh-h b{font-size:20px;font-weight:500}
.ch-ai{display:inline-flex;align-items:center;gap:4px;padding:2px 10px 2px 6px;border-radius:10px;background:var(--primary-c);color:var(--on-primary-c);font-size:12px}
.ch-ai .ic{width:14px;height:14px}
.ch-sh-s{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:6px;font-size:13px;color:var(--on-2)}
.ch-sh-p{margin:0 0 6px;font-size:13px;color:var(--on-2)}
.ch-tchip{padding:3px 10px;border-radius:8px;background:var(--bad-c);color:#7a0f08;font-size:13px}
.ch-lb{display:block;margin:12px 0 4px;font-size:12px;font-weight:500;letter-spacing:.3px;color:var(--on-2)}
.ch-in{display:block;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--outline);background:var(--surface);font-size:16px;line-height:1.5;outline:none;resize:vertical;user-select:text;-webkit-user-select:text}
.ch-in:focus{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
input.ch-in{height:48px;padding:0 12px}
input.ch-in+input.ch-in{margin-top:6px}
.ch-sb .ch-opts{margin-top:8px}
.ch-sb .ch-pics{margin-top:0}
.ch-foot{position:sticky;bottom:0;margin:12px -16px 0;padding:10px 16px calc(14px + var(--nav-h));background:var(--surface-1)}
.ch-go{height:52px;font-size:16px}.ch-go .ic{width:22px;height:22px}
.ch-gen{display:flex;align-items:center;gap:12px;padding:4px 0 12px;color:var(--on-2);font-size:14px}
.ch-gen .spinner{width:22px;height:22px}
.ch-skel{display:flex;flex-direction:column;gap:10px;padding-bottom:20px}
.ch-skel i{display:block;height:56px;border-radius:12px}
.ch-gprev{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:36px;margin-top:12px;font-size:16px}
.ch-vbox{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:112px;margin-top:10px;padding:12px 16px;border-radius:20px;background:var(--surface-3);transition:background .3s}
.ch-vbox[data-st=listen]{background:var(--primary-c)}
.ch-vwave{display:none;align-items:center;justify-content:space-between;height:26px}
.ch-vbox[data-st=listen] .ch-vwave{display:flex}
.ch-vwave i{width:3px;height:20px;border-radius:2px;background:var(--primary);transform:scaleY(.14);animation:ch-wv var(--d,.7s) ease-in-out infinite alternate}
.ch-vtxt{font-size:16px;line-height:1.6;min-height:26px;word-break:break-word}
.ch-vtxt .int{color:var(--on-2);opacity:.7}
.ch-vhint{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--on-2)}
.ch-vhint .ic{width:18px;height:18px;color:var(--ok)}
.ch-vhint .rec{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);animation:ch-blink 1s steps(2) infinite}
.ch-vrow{display:flex;align-items:center;gap:10px}
.ch-vrow .btn[data-act=vsend]{flex:1;height:52px;font-size:16px}.ch-vrow .btn .ic{width:20px;height:20px}
.ch-vrow .btn[data-act=vsend]:disabled{opacity:.38}
.ch-vrow .btn.text{height:52px;padding:0 8px}
.ch-vmic{position:relative;width:56px;height:56px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ch-vmic .ic{width:28px;height:28px}
.ch-vbox[data-st=listen]~.ch-foot .ch-vmic{background:var(--bad)}
.ch-vbox[data-st=done]~.ch-foot .ch-vmic{background:var(--outline)}

/* ===== Part B: shell, home, chats, board, machines, me ===== */
:root{--b-ok-t:#0d652d;--b-warn-t:#8a4b00;--b-bad-t:#a50e0e}
html[data-role=foreman]{--font:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",Roboto,"Google Sans",system-ui,sans-serif}
.tab .pill .cl-tbadge{position:absolute;top:2px;right:12px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--error);color:#fff;font-size:11px;line-height:16px;text-align:center}
.tab .pill{overflow:visible}
.tab .pill .ripple-ink{border-radius:50%}

/* shared status chip */
.hm-st{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0}
.hm-st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.hm-st[data-s=green]{background:var(--ok-c);color:var(--b-ok-t)}
.hm-st[data-s=orange]{background:var(--warn-c);color:var(--b-warn-t)}
.hm-st[data-s=red]{background:var(--bad-c);color:var(--b-bad-t)}
.hm-st[data-s=wait]{background:var(--surface-3);color:var(--on-2)}
.hm-st.hm-lk::before{display:none}
.hm-st .hm-ci{width:16px;height:16px;fill:currentColor}
.hm-ci{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.hm-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--wait)}
.hm-dot[data-s=green]{background:var(--ok)}.hm-dot[data-s=orange]{background:var(--warn)}.hm-dot[data-s=red]{background:var(--bad)}
.hm-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex-shrink:0;font-size:16px}
.hm-av.sm{width:24px;height:24px;font-size:11px}
.hm-av.lg{width:72px;height:72px;font-size:30px}
.hm-av.md{width:48px;height:48px}
.hm-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ===== Home ===== */
.hm-hello{margin:12px 0 0}
.hm-hello h2{margin:0;font-size:26px;font-weight:400;line-height:1.25}
.hm-date{font-size:14px;color:var(--on-2);margin-top:2px}
.hm-h{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 8px;font-size:14px;font-weight:500;color:var(--on-2);letter-spacing:.1px}
.hm-sum{padding:16px}
.hm-counts{display:flex;gap:8px}
.hm-count{flex:1;border-radius:12px;padding:12px 4px;text-align:center}
.hm-count b{display:block;font-size:32px;font-weight:500;line-height:1.1}
.hm-count span{font-size:13px;font-weight:500}
.hm-count[data-s=green]{background:var(--ok-c);color:var(--b-ok-t)}
.hm-count[data-s=orange]{background:var(--warn-c);color:var(--b-warn-t)}
.hm-count[data-s=red]{background:var(--bad-c);color:var(--b-bad-t)}
.hm-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:16px;background:var(--surface-3)}
.hm-bar i{display:block;height:100%}
.hm-bar i[data-s=green]{background:var(--ok)}.hm-bar i[data-s=orange]{background:var(--warn)}.hm-bar i[data-s=red]{background:var(--bad)}.hm-bar i[data-s=wait]{background:var(--wait)}
.hm-bar-cap{font-size:13px;color:var(--on-2);margin-top:8px}
.hm-tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.hm-tile{padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .15s var(--ease)}
.hm-tile:active,.cl-item:active .cl-av{transform:scale(.97)}
.hm-tile b{font-size:32px;font-weight:500;line-height:1.1}
.hm-tile span{font-size:14px;color:var(--on-2)}
.hm-empty{display:flex;align-items:center;gap:12px;padding:16px;color:var(--on-2);font-size:15px}
.hm-empty .hm-ci{width:28px;height:28px;color:var(--ok)}
.hm-sub2{font-size:14px;color:var(--on-2)}
.hm-chk{padding:16px;display:block;width:100%;text-align:left;margin-bottom:8px;box-shadow:inset 4px 0 0 var(--warn)}
.hm-chk .from{font-size:13px;color:var(--on-2);margin-bottom:4px}
.hm-chk .q{font-size:16px}
.hm-chk .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.hm-big{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--on-2)}

/* ===== Chats ===== */
.cl-item{display:flex;align-items:center;gap:16px;min-height:76px;padding:10px 16px;width:100%;text-align:left}
.cl-av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;font-size:18px;flex-shrink:0;transition:transform .15s var(--ease)}
.cl-av.grp{background:var(--primary-c);color:var(--on-primary-c)}
.cl-av .ic{width:26px;height:26px}
.cl-mid{flex:1;min-width:0}
.cl-title{font-size:16px;font-weight:500}
.cl-prev{font-size:14px;color:var(--on-2);display:flex;align-items:center;gap:4px;min-width:0}
.cl-prev .hm-ell{min-width:0}
.cl-mi{width:16px;height:16px;fill:currentColor;flex-shrink:0}
.cl-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;min-width:44px}
.cl-time{font-size:12px;color:var(--on-2)}
.cl-r2{display:flex;align-items:center;gap:6px;min-height:20px}
.cl-badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--primary);color:var(--on-primary);font-size:12px;font-weight:500;display:grid;place-items:center}
.cl-item.unread .cl-title,.cl-item.unread .cl-prev{color:var(--on);font-weight:500}
.cl-item.unread .cl-time{color:var(--primary);font-weight:500}

/* ===== Board ===== */
.bd-strip{flex:1;min-height:0;display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;padding:4px 16px 8px;scroll-snap-type:x mandatory;scroll-padding:0 16px;overscroll-behavior-x:contain}
.bd-strip::-webkit-scrollbar{display:none}
.bd-strip.bd-dragging{scroll-snap-type:none}
.bd-col{flex:0 0 85%;scroll-snap-align:start;display:flex;flex-direction:column;min-height:0;background:var(--surface-2);border-radius:16px;transition:box-shadow .15s}
.bd-col.bd-over{box-shadow:inset 0 0 0 2px var(--primary);background:var(--primary-c)}
.bd-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-size:16px;font-weight:500}
.bd-head i{width:10px;height:10px;border-radius:50%;background:var(--outline)}
.bd-col[data-col=doing] .bd-head i{background:var(--warn)}
.bd-col[data-col=done] .bd-head i{background:var(--ok)}
.bd-count{min-width:24px;height:24px;padding:0 8px;border-radius:12px;background:var(--surface-3);color:var(--on-2);font-size:13px;display:grid;place-items:center}
.bd-list{flex:1;min-height:0;overflow-y:auto;padding:0 8px 96px;overscroll-behavior:contain}
.bd-list::-webkit-scrollbar{display:none}
.bd-card{position:relative;background:var(--surface);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.16),0 0 0 1px var(--outline-2);cursor:grab;touch-action:pan-x pan-y;-webkit-touch-callout:none;transition:transform .15s var(--ease)}
.bd-card:active{transform:scale(.985)}
.bd-card.bd-hole{opacity:.3}
.bd-title{font-size:16px;font-weight:500;line-height:1.3}
.bd-card[data-col=done] .bd-title{color:var(--on-2);text-decoration:line-through;text-decoration-color:var(--outline)}
.bd-meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-top:8px;font-size:13px;color:var(--on-2)}
.bd-meta span{display:inline-flex;align-items:center;gap:4px}
.bd-meta .hm-ci{width:16px;height:16px}
.bd-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;min-height:28px}
.bd-avs{display:flex}
.bd-avs .hm-av{box-shadow:0 0 0 2px var(--surface);margin-left:-6px}
.bd-avs .hm-av:first-child{margin-left:0}
.bd-src{position:relative;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px 0 8px;border-radius:14px;background:var(--primary-c);color:var(--on-primary-c);font-size:13px;font-weight:500}
.bd-src::after{content:"";position:absolute;inset:-10px -4px}
.bd-src .hm-ci{width:16px;height:16px}
.bd-empty{margin:4px 0;padding:24px 12px;border-radius:12px;border:2px dashed var(--outline-2);color:var(--on-2);font-size:14px;text-align:center}
.bd-card.bd-new{animation:bd-in .5s var(--ease-out) both;animation-delay:var(--d,0ms)}
.bd-card.bd-new::after{content:"";position:absolute;inset:0;border-radius:12px;background:var(--primary-c);box-shadow:inset 0 0 0 2px var(--primary);opacity:0;pointer-events:none;animation:bd-flash 1.8s ease-out both;animation-delay:var(--d,0ms)}
@keyframes bd-in{from{opacity:0;transform:translateY(24px) scale(.96)}}
@keyframes bd-flash{0%{opacity:0}25%{opacity:.7}100%{opacity:0}}
.bd-ghost{position:absolute;left:0;top:0;z-index:50;pointer-events:none;will-change:transform}
.bd-ghost .bd-card{margin:0;animation:bd-lift .16s var(--ease-out) both;box-shadow:0 12px 28px rgba(0,0,0,.28),0 0 0 1px var(--primary)}
.bd-ghost .bd-card::after{display:none}
@keyframes bd-lift{from{transform:none}}
.bd-ghost .bd-card{transform:scale(1.05) rotate(1.2deg)}

/* add-task sheet */
.bd-sh{margin:0 0 16px;font-size:22px;font-weight:400}
.bd-lbl{margin:16px 0 8px;font-size:14px;font-weight:500;color:var(--on-2)}
.bd-wrap{flex-wrap:wrap}
.bd-wrap .chip{height:40px;padding:0 16px;font-size:15px}
.bd-sheet .btn.block{height:48px;margin-top:24px;border-radius:24px;font-size:16px}

/* ===== Task detail ===== */
.bd-big{margin:8px 0 16px;font-size:24px;font-weight:400;line-height:1.3}
.bd-seg{display:flex;border-radius:24px;box-shadow:inset 0 0 0 1px var(--outline);overflow:hidden}
.bd-seg button{flex:1;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:500;position:relative;overflow:hidden;color:var(--on)}
.bd-seg button+button{box-shadow:inset 1px 0 0 var(--outline)}
.bd-seg button.on{background:var(--primary-c);color:var(--on-primary-c)}
.bd-seg .hm-ci{display:none;width:18px;height:18px}
.bd-seg button.on .hm-ci{display:block}
.bd-q{margin:0;padding:12px 16px;border-left:4px solid var(--primary);background:var(--surface-1);border-radius:0 12px 12px 0}
.bd-q .who{font-size:13px;color:var(--on-2);display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bd-q .txt{font-size:16px}
.bd-cm{display:flex;align-items:center;gap:8px;height:48px;padding:0 16px;border-radius:24px;background:var(--surface-2);color:var(--on-2);font-size:15px;width:100%;text-align:left}
.lead{width:24px;height:24px;fill:var(--on-2);flex-shrink:0}
.bd-nm{display:flex;flex-wrap:wrap;gap:8px}
.bd-nm span{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:16px;background:var(--surface-2);font-size:14px}

/* ===== Machines ===== */
.mc-card{display:block;width:100%;text-align:left;padding:16px;margin-bottom:12px;transition:transform .15s var(--ease)}
.mc-card:active{transform:scale(.985)}
.mc-name{font-size:18px;font-weight:500}
.mc-ws{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mc-wchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:16px;font-size:14px;font-weight:500}
.mc-wchip[data-r="1"]{background:var(--ok-c);color:var(--b-ok-t)}
.mc-wchip[data-r="0"]{background:var(--surface-3);color:var(--on-2)}
.mc-wchip .hm-ci{width:16px;height:16px}
.mc-big{display:flex;align-items:center;gap:16px;padding:20px 16px;margin-bottom:12px;border-radius:16px;width:100%;text-align:left}
.mc-big .st{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;flex-shrink:0}
.mc-big .st .ic{width:36px;height:36px}
.mc-big[data-r="1"]{background:var(--ok-c);color:var(--b-ok-t)}
.mc-big[data-r="1"] .st{background:var(--ok);color:#fff}
.mc-big[data-r="0"]{background:var(--surface-2)}
.mc-big[data-r="0"] .st{background:var(--surface-3);color:var(--on-2)}
.mc-big .nm{font-size:20px;font-weight:500;color:var(--on)}
.mc-big .stt{font-size:15px;font-weight:500;margin-top:2px}
.mc-big[data-r="0"] .stt{color:var(--on-2)}
.mc-big .btn{margin-top:12px;height:48px;border-radius:24px}
.mc-qr{display:grid;place-items:center;padding:20px;background:#fff;border-radius:16px;box-shadow:inset 0 0 0 1px var(--outline-2)}
.mc-qr svg{width:176px;height:176px;display:block}
.mc-cap{text-align:center;font-size:13px;color:var(--on-2);margin:8px 16px 0}

/* ===== Me ===== */
.me-prof{display:flex;align-items:center;gap:16px;padding:24px 16px 8px}
.me-prof h2{margin:0;font-size:22px;font-weight:400}
.me-role{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:14px;background:var(--primary-c);color:var(--on-primary-c);font-size:13px;font-weight:500;margin-top:4px}
.me-val{font-size:14px;color:var(--on-2)}
.me-pass .list-item{min-height:64px}
.me-pass .ok{fill:var(--ok)}
.me-pass .no{fill:var(--outline)}
.me-pass .off{opacity:.65}

/* ===== Entry points (quick actions, scan CTA, briefing card, follow-up inbox) ===== */
.hm-qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hm-qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:96px;padding:12px 4px;border-radius:16px;background:var(--surface-1);text-align:center;position:relative;overflow:hidden;transition:transform .15s var(--ease)}
.hm-qa:active{transform:scale(.96)}
.hm-qi{position:relative;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--primary-c);color:var(--on-primary-c);flex-shrink:0}
.hm-qi .ic{width:24px;height:24px}
.hm-qb{position:absolute;top:-6px;right:-8px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:var(--ux-onbad,#fff);font-size:12px;font-weight:700;font-style:normal;line-height:20px;text-align:center}
.hm-ql{font-size:13px;font-weight:500;line-height:1.2}
.hm-scan{position:absolute;left:16px;right:16px;bottom:calc(96px + var(--nav-h));z-index:5;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--primary);color:var(--on-primary);font-size:18px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.25);overflow:hidden}
.hm-scan .ic{width:28px;height:28px}
.hm-brief{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px;margin-top:16px;box-shadow:inset 4px 0 0 var(--primary)}
.hm-brief .grow{flex:1;min-width:0}.hm-brief .from{font-size:13px;color:var(--on-2)}.hm-brief .q{font-size:16px}
.hm-panel{height:48px;border-radius:24px;margin-top:16px;gap:8px}
.hm-panel .ic{width:20px;height:20px}
.hm-fu{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;margin-top:16px;background:var(--bad-c);color:var(--b-bad-t);border-radius:16px;transition:transform .15s var(--ease)}
.hm-fu:active{transform:scale(.985)}
.hm-fu[data-z="1"]{background:var(--ok-c);color:var(--b-ok-t)}
.hm-fu b{display:block;font-size:22px;font-weight:500;line-height:1.2}.hm-fu span{font-size:14px}
.hm-fu .hm-qi{background:var(--bad);color:var(--ux-onbad,#fff);width:48px;height:48px}.hm-fu[data-z="1"] .hm-qi{background:var(--ok)}
.hm-fu .grow{flex:1;min-width:0}
.hm-learn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 16px}
.hm-learn .grow{flex:1}.hm-learn small{display:block;font-size:13px;color:var(--on-2)}

/* ===== Part C: safety (prefix sf-). Colors via tokens only; sf- tokens below are the only literals (camera is dark in both themes) ===== */
:root{--sf-cam:#0b0d10;--sf-on-solid:#fff;
  --sf-ok-t:color-mix(in srgb,var(--ok),var(--on) 55%);--sf-warn-t:color-mix(in srgb,var(--warn),var(--on) 55%);--sf-bad-t:color-mix(in srgb,var(--bad),var(--on) 55%)}
.sf-ic{width:24px;height:24px;fill:currentColor;flex-shrink:0}
.sf-ic path{fill-rule:evenodd}
.sf-ic.s{width:18px;height:18px}
.sf-sp{width:48px;height:48px}
.sf-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sf-clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sf-stack{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.sf-wrapr{flex-wrap:wrap}
.sf-sh-h{margin:12px 4px 0;font-size:14px;font-weight:500;color:var(--on-2);letter-spacing:.1px}
.sf-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 24px;text-align:center;color:var(--on-2)}
.sf-empty .sf-ic{width:40px;height:40px}
.sf-foot{display:flex;gap:8px;flex-shrink:0;padding:12px 16px calc(12px + var(--nav-h));background:var(--surface-1)}
.sf-two{display:flex;gap:8px}.sf-two>.btn{flex:1}
.btn.sf-big{height:56px;border-radius:28px;font-size:16px}
.btn.sf-big:disabled,.sf-foot .btn:disabled{background:var(--surface-3);color:var(--on-2);box-shadow:none;opacity:.7}
.sf-hint{margin:0 4px 12px;color:var(--on-2)}
.sf-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--sf-on-solid);font-weight:500;flex-shrink:0}
.sf-av.sm{width:22px;height:22px;font-size:11px;display:inline-grid;vertical-align:middle;margin-right:6px}
.sf-av.lg{width:48px;height:48px;font-size:18px}

/* status chip */
.sf-st{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;vertical-align:middle}
.sf-st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sf-st.sf-lk::before{display:none}
.sf-st.sm{height:22px;font-size:12px;padding:0 8px;margin-right:6px}
.sf-st[data-s=green]{background:var(--ok-c);color:var(--sf-ok-t)}
.sf-st[data-s=orange]{background:var(--warn-c);color:var(--sf-warn-t)}
.sf-st[data-s=red]{background:var(--bad-c);color:var(--sf-bad-t)}
.sf-st[data-s=wait]{background:var(--surface-3);color:var(--on-2)}
.sf-sev{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:500;vertical-align:middle}
.sf-sev[data-sv=low]{background:var(--ok-c);color:var(--sf-ok-t)}.sf-sev[data-sv=mid]{background:var(--warn-c);color:var(--sf-warn-t)}.sf-sev[data-sv=high]{background:var(--bad-c);color:var(--sf-bad-t)}
.sf-sdot{width:8px;height:8px;border-radius:50%;margin-right:8px}
.sf-sdot[data-sv=low]{background:var(--ok)}.sf-sdot[data-sv=mid]{background:var(--warn)}.sf-sdot[data-sv=high]{background:var(--bad)}
.sf-chips{display:flex;flex-wrap:wrap;gap:8px}
.sf-chips .chip{height:40px;padding:0 16px}
.sf-live{display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--ok);position:relative;vertical-align:middle}
.sf-live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--ok);animation:sf-ping 1.6s var(--ease-out) infinite}
@keyframes sf-ping{from{transform:scale(1);opacity:.6}to{transform:scale(2.6);opacity:0}}
@keyframes sf-pop{0%{transform:scale(.94)}50%{transform:scale(1.04)}100%{transform:none}}
@keyframes sf-in{from{opacity:0;transform:translateX(24px)}}
.sf-pop{animation:sf-pop .5s var(--ease-out)}

/* waveform */
.sf-wave{display:flex;align-items:center;justify-content:center;gap:3px;height:44px;flex:1;min-width:0}
.sf-wave i{width:3px;height:var(--h);border-radius:2px;background:var(--on-2);opacity:.3;transform:scaleY(.35)}
.sf-rec.on .sf-wave i,.sf-bmic.on~.sf-wave i{opacity:1;background:var(--primary);animation:sf-wv .6s ease-in-out infinite alternate var(--d)}
@keyframes sf-wv{to{transform:scaleY(1.5)}}

/* ===== scan ===== */
.sf-cam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;background:var(--sf-cam);color:var(--sf-on-solid);overflow:hidden;padding-top:var(--status-h)}
.sf-cam-bg{position:absolute;inset:-10%;background:radial-gradient(40% 30% at 22% 30%,color-mix(in srgb,var(--sf-on-solid) 16%,transparent),transparent 70%),radial-gradient(35% 25% at 80% 68%,color-mix(in srgb,var(--sf-on-solid) 11%,transparent),transparent 70%),radial-gradient(50% 40% at 50% 100%,color-mix(in srgb,var(--sf-on-solid) 8%,transparent),transparent 70%);filter:blur(14px)}
.sf-cam-torch{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,var(--sf-on-solid),transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.sf-cam.sf-torch .sf-cam-torch{opacity:.22}
.sf-cam-top{position:relative;z-index:1;width:100%;display:flex;align-items:center;gap:4px;min-height:64px;padding:0 4px}
.sf-cam-top b{flex:1;font-size:20px;font-weight:500;margin-left:8px}
.sf-cam-top .icon-btn{color:var(--sf-on-solid)}
.sf-cam [aria-pressed=true]{background:color-mix(in srgb,var(--sf-on-solid) 22%,transparent)}
.sf-t-on{display:none}.sf-cam.sf-torch .sf-t-on{display:block}.sf-cam.sf-torch .sf-t-off{display:none}
.sf-vf{position:relative;z-index:1;width:250px;height:250px;margin-top:40px;flex-shrink:0}
.sf-vf i{position:absolute;width:44px;height:44px;border:0 solid var(--sf-on-solid);transition:border-color .2s}
.sf-vf i.tl{left:0;top:0;border-width:4px 0 0 4px;border-top-left-radius:16px}
.sf-vf i.tr{right:0;top:0;border-width:4px 4px 0 0;border-top-right-radius:16px}
.sf-vf i.bl{left:0;bottom:0;border-width:0 0 4px 4px;border-bottom-left-radius:16px}
.sf-vf i.br{right:0;bottom:0;border-width:0 4px 4px 0;border-bottom-right-radius:16px}
.sf-vf i.sf-line{left:10px;right:10px;top:0;width:auto;height:3px;border:0;border-radius:2px;background:var(--ok-c);box-shadow:0 0 14px 2px var(--ok-c);animation:sf-scan 2s ease-in-out infinite alternate}
@keyframes sf-scan{from{transform:translateY(8px)}to{transform:translateY(238px)}}
.sf-qr{position:absolute;inset:26px;opacity:0;transform:scale(1.12);transition:opacity .25s,transform .35s var(--ease-out)}
.sf-qr svg{display:block;width:100%;height:100%;border-radius:6px}
.sf-qrbg{fill:var(--sf-on-solid)}.sf-qrfg{fill:var(--sf-cam)}
.sf-vf.sf-hit i:not(.sf-line){border-color:var(--ok-c)}
.sf-vf.sf-hit i.sf-line{opacity:0;animation:none}
.sf-vf.sf-hit .sf-qr{opacity:1;transform:none}
.sf-cam-msg{position:relative;z-index:1;margin:24px 24px 0;text-align:center;font-size:16px}
.sf-cam-chips{position:relative;z-index:1;display:flex;gap:8px;width:100%;padding:0 16px;margin-top:auto}
.sf-cchip{flex:1;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 4px;border-radius:var(--r-l);background:color-mix(in srgb,var(--sf-on-solid) 14%,transparent);color:var(--sf-on-solid);font-size:13px;line-height:1.25;text-align:center;position:relative;overflow:hidden}
.sf-mini{width:36px;height:36px;display:block}.sf-mini svg{display:block;width:100%;height:100%;border-radius:3px}
.sf-cam-tip{position:relative;z-index:1;margin:12px 0 calc(16px + var(--nav-h));font-size:13px;opacity:.7}

/* ===== panel ===== */
.sf-pn{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;color:var(--sf-on-solid);background:var(--bad)}
.sf-pn[data-st=ready]{background:var(--ok)}
.sf-sweep{position:absolute;left:50%;top:230px;width:1500px;height:1500px;margin:-750px 0 0 -750px;border-radius:50%;transform:scale(0);pointer-events:none;will-change:transform}
.sf-sweep[data-to=ready]{background:var(--ok)}.sf-sweep[data-to=lock]{background:var(--bad)}
.sf-pn-top,.sf-pn-hero,.sf-pn-sheet{position:relative;z-index:1}
.sf-pn-top{display:flex;align-items:center;gap:4px;padding:var(--status-h) 4px 0;min-height:calc(64px + var(--status-h));font-size:18px;font-weight:500;flex-shrink:0}
.sf-pn-top .icon-btn{color:var(--sf-on-solid)}
.sf-pn-hero{flex:1;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 24px}
.sf-lock{width:132px;height:132px;color:var(--sf-on-solid);overflow:visible;animation:sf-pop .6s var(--ease-out)}
.sf-key{fill:var(--sf-cam);opacity:.45}
.sf-shk{transform-origin:8px 11px;transition:transform .55s var(--ease)}
.sf-pn[data-ic=ready] .sf-shk{transform:rotate(-34deg)}
.sf-pn-lbl{display:grid;margin-top:8px}
.sf-pn-lbl b{grid-area:1/1;font-size:48px;font-weight:700;letter-spacing:.04em;line-height:1.15;transition:opacity .35s,transform .45s var(--ease)}
.sf-pn[data-ic=lock] .sf-l-ok{opacity:0;transform:translateY(16px)}
.sf-pn[data-ic=ready] .sf-l-lock{opacity:0;transform:translateY(-16px)}
.sf-pn-mc{font-size:22px;font-weight:500;margin-top:4px}
.sf-pn-sub{font-size:15px;opacity:.92;margin-top:4px}
.sf-pn-sheet{flex-shrink:0;max-height:62%;overflow-y:auto;background:var(--bg);color:var(--on);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + var(--nav-h))}
.sf-pn-sheet .sf-sh-h{margin:0 4px 8px}
.sf-pres{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sf-pres .grow,.sf-wrow .grow{flex:1;min-width:0}
.sf-pres .sub,.sf-wrow .sub,.sf-signed .sub{font-size:14px;color:var(--on-2)}
.sf-signed{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:var(--r-m);background:var(--ok-c);color:var(--sf-ok-t);margin-bottom:12px}
.sf-signed .sub{color:inherit;opacity:.85}
.sf-wl{list-style:none;margin:0 0 12px;padding:0}
.sf-wrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:8px 0;min-height:64px;border-radius:var(--r-m)}
.sf-wrow+.sf-wrow{border-top:1px solid var(--outline-2)}
.sf-wrow .sf-rem{flex-basis:100%;margin:0 0 4px 52px}
.btn.sf-rem{height:48px;gap:6px;flex-basis:100%;justify-content:flex-start;padding:0 16px;max-width:fit-content}

/* ===== note + check ===== */
.sf-nh{display:flex;align-items:center;gap:12px}
.sf-ver{display:inline-grid;place-items:center;min-width:44px;height:32px;padding:0 10px;border-radius:16px;background:var(--primary-c);color:var(--on-primary-c);font-weight:500;font-size:14px}
.sf-ver-r{margin-right:12px}
.sf-nh .sub{font-size:14px;color:var(--on-2)}
.sf-steps{list-style:none;margin:0;padding:0;counter-reset:s}
.sf-steps li{display:flex;gap:12px;align-items:flex-start;padding:12px 0}
.sf-steps li+li{border-top:1px solid var(--outline-2)}
.sf-steps .grow{flex:1;min-width:0}
.sf-sic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--primary-c);color:var(--on-primary-c)}
.sf-sic[data-k=hot],.sf-sic[data-k=pinch]{background:var(--warn-c);color:var(--sf-warn-t)}
.sf-sic[data-k=lock]{background:var(--bad-c);color:var(--sf-bad-t)}
.sf-se{font-size:18px;line-height:1.4;padding-top:8px}
.sf-sj{font-size:17px;font-weight:500;line-height:1.5}
.sf-en,.sf-bt{margin-top:6px;padding:8px 12px;border-radius:var(--r-s);background:var(--surface-2);font-size:14px;line-height:1.45;color:var(--on-2)}
.sf-bt{background:var(--warn-c);color:var(--sf-warn-t)}
.sf-en span,.sf-bt span{display:block;font-size:12px;font-weight:500;opacity:.8;margin-bottom:2px}
.sf-qprev{padding:4px 0}
.sf-qprev>div{display:flex;gap:12px;padding:10px 16px}
.sf-qn{display:inline-grid;place-items:center;height:24px;padding:0 8px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);font-size:12px;font-weight:500;flex-shrink:0}
.sf-qprev .sub{font-size:14px;color:var(--on-2)}
.sf-dots{display:flex;gap:6px}
.sf-dots i{flex:1;height:6px;border-radius:3px;background:var(--surface-3);transition:background .3s}
.sf-dots i.cur{background:var(--primary)}.sf-dots i.ok{background:var(--ok)}.sf-dots i.no{background:var(--bad)}
.sf-q{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.sf-q.sf-slide{animation:sf-in .35s var(--ease-out) both}
.sf-qk{font-size:14px;color:var(--on-2)}
.sf-qt{margin:0 0 8px;font-size:24px;font-weight:400;line-height:1.3}
.sf-opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:12px 16px;border-radius:var(--r-m);text-align:left;font-size:16px;line-height:1.35;box-shadow:inset 0 0 0 1px var(--outline);background:var(--surface);transition:background .2s,opacity .2s}
.sf-opt:active{background:var(--surface-3)}
.sf-opt.ns{color:var(--on-2)}
.sf-opt.ok{background:var(--ok-c);color:var(--sf-ok-t);box-shadow:none}
.sf-opt.bad{background:var(--bad-c);color:var(--sf-bad-t);box-shadow:none}
.sf-opt.dim{opacity:.5}
.sf-fb{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-m);animation:sf-in .3s var(--ease-out) both}
.sf-fb.ok{background:var(--ok-c);color:var(--sf-ok-t)}.sf-fb.bad{background:var(--bad-c);color:var(--sf-bad-t)}.sf-fb.warn{background:var(--warn-c);color:var(--sf-warn-t)}
.sf-fb .sub{font-size:14px;margin-top:4px;opacity:.9}
.sf-rv{display:flex;gap:8px;align-items:center}
.sf-rv .sf-sic{width:36px;height:36px}
.sf-res{display:flex;flex-direction:column;align-items:center;text-align:center;padding:40px 24px 16px;gap:8px}
.sf-res h2{margin:8px 0 0;font-size:28px;font-weight:400}.sf-res p{margin:0;color:var(--on-2)}
.sf-res .sf-two{width:100%;margin-top:16px}
.sf-resic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:var(--sf-on-solid);animation:sf-pop .6s var(--ease-out)}
.sf-resic .sf-ic{width:56px;height:56px}
.sf-resic.ok{background:var(--ok)}.sf-resic.bad{background:var(--bad)}

/* ===== near-miss ===== */
.sf-rec{display:flex;align-items:center;gap:12px}
.sf-mic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);flex-shrink:0;touch-action:none;position:relative;transition:transform .15s var(--ease),background .2s}
.sf-mic .sf-ic{width:32px;height:32px}
.sf-rec.on .sf-mic{background:var(--bad);transform:scale(1.08)}
.sf-rec.on .sf-mic::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--bad);animation:sf-ping 1.1s var(--ease-out) infinite;z-index:-1}
.sf-tm{font-size:14px;color:var(--on-2);font-variant-numeric:tabular-nums;width:32px}
.sf-ta{display:block;width:100%;padding:12px 16px;border-radius:var(--r-s);border:1px solid var(--outline);background:none;outline:none;resize:none;font-size:16px;line-height:1.45}
.sf-ta:focus{border:2px solid var(--primary);padding:11px 15px}
.sf-phwrap{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.sf-phwrap .sf-photo{width:100%}
.sf-add{height:48px}
.sf-photo{position:relative;border-radius:var(--r-m);overflow:hidden;aspect-ratio:3/2;background:var(--surface-3);width:100%}
.sf-photo.tap{cursor:crosshair}
.sf-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.sf-photo img.on{opacity:1}
.sf-ph-fb{position:absolute;inset:0;display:grid;place-items:center;color:var(--on-2);background:linear-gradient(90deg,var(--surface-3),var(--surface-1),var(--surface-3));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.sf-ph-fb .sf-ic{width:40px;height:40px;opacity:.6}
.sf-photo.err .sf-ph-fb{animation:none;background:var(--surface-3)}
.sf-ring{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border:3px solid var(--bad);border-radius:50%;box-shadow:0 0 0 2px color-mix(in srgb,var(--sf-on-solid) 70%,transparent);pointer-events:none;animation:sf-ring .55s var(--ease-out) .3s both}
@keyframes sf-ring{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
.sf-send{gap:10px}
.sf-fchips{display:flex;gap:8px;padding:0 16px 8px;flex-shrink:0}
.sf-fchips .chip{height:40px;gap:8px}
.sf-cn{font-weight:500}
.sf-list{padding:0 0 8px}
.sf-nrow{display:flex;gap:12px;align-items:stretch;width:100%;padding:12px 16px;text-align:left;position:relative;overflow:hidden;min-height:80px}
.sf-nrow+.sf-nrow{border-top:1px solid var(--outline-2)}
.sf-nrow .grow{flex:1;min-width:0}
.sf-bar{width:4px;border-radius:2px;flex-shrink:0;background:var(--wait)}
.sf-bar[data-sv=low]{background:var(--ok)}.sf-bar[data-sv=mid]{background:var(--warn)}.sf-bar[data-sv=high]{background:var(--bad)}
.sf-nm-h{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.sf-nm-h span{font-size:13px;color:var(--on-2)}
.sf-nrow .sub{font-size:14px;color:var(--on-2);margin-top:4px}
.sf-thumb{width:64px;height:64px;border-radius:var(--r-s);overflow:hidden;background:var(--surface-3);flex-shrink:0;align-self:center}
.sf-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.sf-meta{display:flex;flex-direction:column;gap:4px;padding:8px 16px}
.sf-meta>div{display:flex;align-items:center;gap:12px;min-height:36px}
.sf-meta .sf-ic.s{color:var(--on-2);margin:0 2px}
.sf-meta .sf-av.sm{margin:0 2px}
.sf-big-t{padding:16px;font-size:20px;line-height:1.5}
.sf-orig{padding:0 4px;color:var(--on-2);font-size:15px;line-height:1.5}

/* ===== briefing ===== */
.sf-brec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 16px}
.sf-brec p{margin:0;color:var(--on-2);text-align:center}
.sf-bmic{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);position:relative;transition:background .2s,transform .2s var(--ease)}
.sf-bmic .sf-ic{width:40px;height:40px}
.sf-bmic.on{background:var(--bad);transform:scale(1.06)}
.sf-bmic.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--bad);animation:sf-ping 1.1s var(--ease-out) infinite;z-index:-1}
.sf-brec .sf-wave{flex:none;width:100%}
.sf-tx{align-self:stretch;min-height:104px;font-size:18px;line-height:1.7;white-space:pre-wrap}
.sf-tr{display:flex;align-items:center;gap:12px;padding:16px}
.sf-ja-t{padding:16px;font-size:16px;line-height:1.7}
.sf-focus,.sf-change{padding:16px;font-size:18px;line-height:1.45}
.sf-focus{background:var(--primary-c);color:var(--on-primary-c);font-size:20px;font-weight:500}
.sf-change{background:var(--warn-c);color:var(--sf-warn-t)}
.sf-tag{display:block;margin-bottom:6px;font-size:12px;font-weight:500;letter-spacing:.8px;opacity:.8}
.sf-bq{padding:16px}
.sf-qt2{font-size:18px;font-weight:500;line-height:1.4;margin-bottom:4px}
.sf-bq .sub,.sf-from .sub{font-size:14px;color:var(--on-2)}
.sf-op{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--outline-2)}
.sf-op:first-of-type{margin-top:8px}
.sf-op span{display:flex;flex-direction:column}.sf-op small{font-size:12px;color:var(--on-2)}
.sf-op.ok{color:var(--sf-ok-t);font-weight:500}.sf-op:not(.ok){padding-left:32px}
.sf-bsum{display:flex;align-items:center;gap:16px;padding:16px;border-radius:var(--r-l);background:var(--surface-1)}
.sf-bsum .grow{flex:1;min-width:0}
.sf-ringw{position:relative;width:132px;height:132px;flex-shrink:0}
.sf-ringw svg{width:100%;height:100%;display:block}
.sf-seg{fill:none;stroke-width:12;stroke-linecap:round;stroke:var(--wait);opacity:.45;transform-origin:70px 70px;transition:stroke .4s,opacity .4s}
.sf-seg[data-s=green]{stroke:var(--ok);opacity:1}.sf-seg[data-s=orange]{stroke:var(--warn);opacity:1}.sf-seg[data-s=red]{stroke:var(--bad);opacity:1}
.sf-ringt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sf-ringt b{font-size:32px;font-weight:500;line-height:1.1}.sf-ringt span{font-size:13px;color:var(--on-2)}
.sf-legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px;font-size:13px;color:var(--on-2)}
.sf-legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:var(--wait)}
.sf-legend i[data-s=green]{background:var(--ok)}.sf-legend i[data-s=orange]{background:var(--warn)}.sf-legend i[data-s=red]{background:var(--bad)}
.sf-from{display:flex;align-items:center;gap:12px}
.sf-read{height:48px;align-self:flex-start;gap:8px}
.sf-eq{display:none;align-items:flex-end;gap:2px;height:16px}
.sf-eq i{width:3px;height:100%;background:currentColor;border-radius:2px;transform-origin:bottom;animation:sf-wv .5s ease-in-out infinite alternate}
.sf-eq i:nth-child(2){animation-delay:.15s}.sf-eq i:nth-child(3){animation-delay:.3s}
.sf-read[aria-pressed=true] .sf-eq{display:inline-flex}
.sf-bcq{display:flex;flex-direction:column;gap:8px}

/* ===== Part D: life outside work (prefix lf-) ===== */
.lf-i{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.lf-i.lg{width:28px;height:28px}
.lf-pad{padding:0 16px}
.lf-h{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 8px;font-size:14px;font-weight:500;color:var(--on-2);letter-spacing:.1px}
.lf-pad>div:first-child>.lf-h:first-child{margin-top:12px}
.lf-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lf-empty{padding:32px 16px;text-align:center;color:var(--on-2);font-size:15px}
.lf-av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:500;flex-shrink:0;font-size:16px}
.lf-av.sm{width:24px;height:24px;font-size:11px}
.lf-av.lg{width:64px;height:64px;font-size:26px}

/* status chip / counts */
.lf-st{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:500;white-space:nowrap;flex-shrink:0;color:var(--on);background:var(--surface-3)}
.lf-st::before,.lf-cn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--wait)}
.lf-st[data-s=green],.lf-cn[data-s=green]{background:var(--ok-c)}
.lf-st[data-s=orange],.lf-cn[data-s=orange]{background:var(--warn-c)}
.lf-st[data-s=red],.lf-cn[data-s=red]{background:var(--bad-c)}
.lf-st[data-s=green]::before,.lf-cn[data-s=green]::before{background:var(--ok)}
.lf-st[data-s=orange]::before,.lf-cn[data-s=orange]::before{background:var(--warn)}
.lf-st[data-s=red]::before,.lf-cn[data-s=red]::before{background:var(--bad)}
.lf-cns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lf-cn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:13px;font-size:13px;font-weight:500;background:var(--surface-3);color:var(--on)}
.lf-cn.z{opacity:.5}

/* rows */
.lf-row{width:100%;text-align:left;min-height:72px;padding:12px 16px}
.lf-row+.lf-row{box-shadow:inset 0 1px 0 var(--outline-2)}
.lf-rmid{flex:1;min-width:0;display:block}
.lf-rmid b{display:block;font-size:16px;font-weight:500;line-height:1.3}
.lf-rmid small{display:block;font-size:13px;color:var(--on-2);margin-top:2px}
.lf-rmid .lf-note{font-size:14px;color:var(--on);margin-top:4px;line-height:1.4}
.lf-tile{width:44px;height:44px;border-radius:12px;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;flex-shrink:0}
.lf-tile .lf-i{width:24px;height:24px}
.lf-chev{color:var(--on-2)}
.lf-badge{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--error);color:var(--on-primary);font-size:12px;font-weight:500;display:inline-grid;place-items:center}

/* worker hub: event strip */
.lf-strip{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scroll-snap-type:x mandatory;scroll-padding:0 16px}
.lf-strip::-webkit-scrollbar{display:none}
.lf-ev{position:relative;flex:0 0 164px;scroll-snap-align:start;border-radius:16px;background:var(--surface-1);box-shadow:inset 0 0 0 1px var(--outline-2)}
.lf-ev.first{background:var(--primary-c);box-shadow:none}
.lf-ev-main{display:block;width:100%;text-align:left;padding:14px 14px 14px;min-height:136px;border-radius:16px}
.lf-ev-d b{display:block;font-size:32px;font-weight:500;line-height:1.05}
.lf-ev-d i{display:block;font-style:normal;font-size:13px;color:var(--on-2);margin-top:2px}
.lf-ev.first .lf-ev-d i{color:var(--on-primary-c)}
.lf-ev-t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:15px;font-weight:500;line-height:1.3;margin-top:10px}
.lf-ev-s{font-size:13px;color:var(--on-2);margin-top:4px}
.lf-ev.first .lf-ev-s{color:var(--on-primary-c)}
.lf-bell{position:absolute;top:2px;right:2px;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--on-2);overflow:hidden}
.lf-bell .lf-i{width:24px;height:24px}
.lf-bell.on{color:var(--primary)}
.lf-ev.first .lf-bell{color:var(--on-primary-c)}

/* ask entry + senpai card */
.lf-askbtn{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 16px;border-radius:16px;background:var(--primary-c);color:var(--on-primary-c);text-align:left;margin-top:24px}
.lf-askbtn .lf-ab{width:44px;height:44px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;flex-shrink:0}
.lf-askbtn b{display:block;font-size:17px;font-weight:500}
.lf-askbtn small{display:block;font-size:13px;opacity:.85;margin-top:2px}
.lf-sen{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;text-align:left;margin-top:12px}
.lf-sen b{display:block;font-size:16px;font-weight:500}
.lf-sen small{display:block;font-size:13px;color:var(--on-2);margin-top:2px}
.lf-newbtn{height:56px;border-radius:28px;font-size:16px;margin-top:16px}

/* notice detail */
