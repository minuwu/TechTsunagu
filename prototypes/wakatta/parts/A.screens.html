    <!-- ===== Part A: chat (pushed screen, params {thread}) ===== -->
    <section class="screen" data-screen="chat">
      <header class="appbar ch-bar">
        <button class="icon-btn" data-back aria-label="Back"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
        <div class="ch-t"><b class="ch-title"></b><span class="ch-sub"></span></div>
        <div class="ch-mem"></div>
      </header>
      <div class="ch-nb" role="status" hidden></div>
      <div class="content ch-list" aria-live="polite"></div>
      <div class="ch-selbar"><button class="btn tonal" data-act="gsel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg><b></b><span>を用語集に追加</span></button></div>
      <div class="ch-comp" data-st="idle">
        <div class="ch-hintw"><div><div class="ch-hint"><span class="t"></span><button class="ch-x" data-act="cancel" hidden aria-label="Cancel auto-send"><svg class="ic" viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg><span>キャンセル</span></button></div></div></div>
        <div class="ch-row">
          <div class="ch-field" data-act="fld">
            <div class="ch-wave" aria-hidden="true"></div>
            <div class="ch-dict"></div>
            <textarea class="ch-ta" rows="1" aria-label="Message"></textarea>
          </div>
          <div class="ch-act">
            <button class="ch-mic" data-act="mic" aria-label="Voice input"><svg class="ic" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg></button>
            <button class="ch-send" data-act="send" aria-label="Send">
              <svg class="ch-ring" viewBox="0 0 68 68" aria-hidden="true"><circle class="tr" cx="34" cy="34" r="30"/><circle class="pg" cx="34" cy="34" r="30"/></svg>
              <svg class="ic" viewBox="0 0 24 24"><path d="M2.01 21 23 12 2.01 3 2 10l15 2-15 2z"/></svg>
              <span class="ch-ok"><svg class="ic" viewBox="0 0 24 24"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>
              <b class="ch-secs"></b>
            </button>
          </div>
        </div>
      </div>
    </section>
