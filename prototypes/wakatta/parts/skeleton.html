<!doctype html>
<!-- data-platform: "android" (Material 3, default) or "ios" -->
<html lang="en" data-platform="android">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#e4effb">
<title>Wakatta? — workplace chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap">
<style>
/* ===== Tokens ===== */
:root{
  /* Nagasaki palette (matches the web app's v2 kit): harbour navy, ocean blue, light blue + white */
  --bg:#e4effb;--surface:#e4effb;--surface-1:#dceaf9;--surface-2:#d3e4f6;--surface-3:#c7dcf2;
  --on:#14213d;--on-2:#4a5a78;--outline:#6f7f9c;--outline-2:#bcd0e8;
  --primary:#1f63b5;--on-primary:#fff;--primary-c:#d8e8fa;--on-primary-c:#0e2e5c;
  --navy:#14213d;--teal:#2a8a8f;--card-bg:#f4f8fd;--card-hover:#dbe9f9;--card-line:#c4d7ee;--card-line-hover:#7fa6d6;
  --shadow-sm:0 1px 2px rgba(20,33,61,.06),0 2px 8px -2px rgba(20,33,61,.08);
  --shadow-md:0 2px 4px rgba(20,33,61,.06),0 10px 24px -8px rgba(20,33,61,.18);
  --error:#b3261e;--scrim:rgba(0,0,0,.32);
  --font:Roboto,"Noto Sans JP","Hind Siliguri","Google Sans",system-ui,sans-serif;
  --r-s:8px;--r-m:12px;--r-l:16px;--r-xl:28px;
  --ease:cubic-bezier(.2,0,0,1);--ease-out:cubic-bezier(.05,.7,.1,1);--dur:400ms;
  --status-h:36px;--nav-h:24px;
}
[data-platform=ios]{
  --bg:#e4effb;--surface:#fff;--surface-1:#fff;--surface-2:#fff;--surface-3:#dfe9f5;
  --on:#14213d;--on-2:#6b7a93;--outline:#c3d0e0;--outline-2:#dfe9f5;
  --primary:#1f63b5;--on-primary:#fff;--primary-c:#e1edfb;--on-primary-c:#1f63b5;
  --error:#ff3b30;--scrim:rgba(0,0,0,.4);
  --font:-apple-system,"SF Pro Text",system-ui,sans-serif;
  --r-s:8px;--r-m:10px;--r-l:12px;--r-xl:14px;
  --ease:cubic-bezier(.32,.72,0,1);--ease-out:cubic-bezier(.32,.72,0,1);--dur:500ms;
  --status-h:54px;--nav-h:34px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:linear-gradient(180deg,#d6e8f8 0,#f2f7fc 60%) fixed;font:16px/1.4 var(--font);color:var(--on);user-select:none;-webkit-user-select:none}
/* Bengali (LANG=bn, or a lang="bn" fragment): Hind Siliguri first on Android and iOS alike, no tracking */
:root:lang(bn){--font:"Hind Siliguri",Roboto,"Noto Sans JP",system-ui,sans-serif}
:lang(bn){font-family:"Hind Siliguri",var(--font);letter-spacing:0}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;user-select:text}

/* ===== Device frame (desktop) / full screen (real phone) ===== */
.device{position:relative;width:412px;height:892px;border-radius:48px;border:12px solid #111;overflow:hidden;background:var(--bg);box-shadow:0 30px 80px rgba(0,0,0,.25);isolation:isolate}
@media (max-width:520px),(pointer:coarse) and (max-width:1024px){
  body{background:var(--bg)}
  .device{width:100vw;height:100dvh;border:0;border-radius:0;box-shadow:none}
  .statusbar{display:none!important}
  :root,[data-platform=ios]{--status-h:env(safe-area-inset-top,0px);--nav-h:env(safe-area-inset-bottom,0px)}
}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--status-h);z-index:900;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:500;pointer-events:none}
[data-platform=ios] .statusbar{font-weight:600;font-size:16px;padding:6px 34px 0}
.statusbar.light{color:#fff}
.gesturebar{position:absolute;bottom:8px;left:50%;width:108px;height:4px;margin-left:-54px;border-radius:4px;background:var(--on);opacity:.85;z-index:900;pointer-events:none}
[data-platform=ios] .gesturebar{width:134px;margin-left:-67px;height:5px}

/* ===== Screens ===== */
.stage{position:absolute;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg);padding-top:var(--status-h);will-change:transform,opacity}
.screen.active,.screen.leaving{display:flex}
.screen[data-root]{padding-bottom:calc(80px + var(--nav-h))}
[data-platform=ios] .screen[data-root]{padding-bottom:calc(50px + var(--nav-h))}
.screen.full{padding-top:0}
.content{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(16px + var(--nav-h))}
.content::-webkit-scrollbar{display:none}
.pad{padding:0 16px}

/* ===== Top app bar ===== */
.appbar{display:flex;align-items:center;gap:4px;min-height:64px;padding:0 4px;flex-shrink:0;transition:background .2s}
.appbar h1{flex:1;margin:0 0 0 12px;font-size:22px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.scrolled{background:var(--surface-2)}
.appbar.large{flex-wrap:wrap;min-height:112px;align-content:space-between;padding-bottom:20px}
.appbar.large h1{flex-basis:100%;order:9;font-size:28px;margin-left:12px}
[data-platform=ios] .appbar{min-height:44px;padding:0 8px;justify-content:space-between}
[data-platform=ios] .appbar h1{flex:1;text-align:center;font-size:17px;font-weight:600;margin:0}
[data-platform=ios] .appbar.large h1{flex:0 0 100%;text-align:left;font-size:34px;font-weight:700;margin-left:8px}
[data-platform=ios] .appbar.large{min-height:96px;padding-bottom:8px}
[data-platform=ios] .appbar.scrolled{background:rgba(249,249,249,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 .5px 0 var(--outline)}
.icon-btn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;position:relative;overflow:hidden;flex-shrink:0}
.icon-btn svg,.ic{width:24px;height:24px;fill:currentColor}

/* ===== Components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 24px;border-radius:20px;font-size:14px;font-weight:500;letter-spacing:.1px;position:relative;overflow:hidden;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--primary-c);color:var(--on-primary-c)}
.btn.outlined{background:none;color:var(--primary);box-shadow:inset 0 0 0 1px var(--outline)}
.btn.text{background:none;color:var(--primary);padding:0 12px}
.btn.block{display:flex;width:100%}
[data-platform=ios] .btn{height:50px;border-radius:var(--r-m);font-size:17px;font-weight:600}
.fab{position:absolute;right:16px;bottom:calc(16px + var(--nav-h));z-index:5;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--primary-c);color:var(--on-primary-c);box-shadow:0 3px 8px rgba(0,0,0,.18);overflow:hidden}
.screen[data-root] .fab{bottom:calc(96px + var(--nav-h))}
.card{background:var(--card-bg);border:1px solid var(--card-line);border-radius:14px;overflow:hidden;position:relative;box-shadow:var(--shadow-sm);transition:background-color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),transform .2s var(--ease)}
.card.outlined{background:#fff}
.card:hover{background:var(--card-hover);border-color:var(--card-line-hover);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card:is(button,a,[role=button],[onclick],[data-go],[data-open]),.card:has(> button:only-child){cursor:pointer}
.card:active{transform:translateY(0);box-shadow:var(--shadow-sm)}
.list{margin:0;padding:0;list-style:none}
.list-item{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;position:relative;overflow:hidden;transition:background-color .2s var(--ease)}
.list-item:is(button,a,[role=button],[onclick],[data-go],[data-open]){cursor:pointer}
.list-item:is(button,a,[role=button],[onclick],[data-go],[data-open]):hover{background:var(--card-hover)}
.list-item .grow{flex:1;min-width:0}
.list-item .sub{font-size:14px;color:var(--on-2)}
[data-platform=ios] .list{background:var(--surface);border-radius:var(--r-m);margin:0 16px}
[data-platform=ios] .list-item{min-height:44px}
[data-platform=ios] .list-item+.list-item::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--outline)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-c);color:var(--on-primary-c);display:grid;place-items:center;font-weight:500;flex-shrink:0;object-fit:cover}
.chip{display:inline-flex;align-items:center;height:32px;padding:0 16px;border-radius:8px;font-size:14px;box-shadow:inset 0 0 0 1px var(--outline);position:relative;overflow:hidden;white-space:nowrap}
.chip.on{background:var(--primary-c);color:var(--on-primary-c);box-shadow:none}
[data-platform=ios] .chip{border-radius:16px;box-shadow:none;background:var(--surface-3)}
.row{display:flex;gap:8px;align-items:center}
.scroll-x{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x>*{scroll-snap-align:start;flex-shrink:0}
.field{display:block;width:100%;height:56px;padding:0 16px;border-radius:4px;border:1px solid var(--outline);background:none;outline:none}
.field:focus{border:2px solid var(--primary);padding:0 15px}
[data-platform=ios] .field{height:44px;border:0;border-radius:var(--r-m);background:var(--surface)}
.switch{appearance:none;-webkit-appearance:none;width:52px;height:32px;border-radius:16px;background:var(--surface-3);box-shadow:inset 0 0 0 2px var(--outline);position:relative;transition:background .2s;flex-shrink:0;margin:0}
.switch::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:all .25s var(--ease)}
.switch:checked{background:var(--primary);box-shadow:none}
.switch:checked::after{left:24px;top:4px;width:24px;height:24px;background:var(--on-primary)}
[data-platform=ios] .switch{width:51px;height:31px;box-shadow:none;background:#e9e9ea}
[data-platform=ios] .switch::after{top:2px;left:2px;width:27px;height:27px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
[data-platform=ios] .switch:checked{background:#34c759}
[data-platform=ios] .switch:checked::after{left:22px;top:2px;width:27px;height:27px}
.skeleton{background:linear-gradient(90deg,var(--surface-3) 0,var(--surface-1) 50%,var(--surface-3) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite;border-radius:var(--r-s)}
/* Splash: the Nekko icon pops in on navy, then fades */
.splash{position:absolute;inset:0;z-index:950;display:grid;place-items:center;background:var(--navy);color:#f5f8fc;pointer-events:none;animation:splash-out .36s .9s var(--ease) forwards}
.splash svg{display:block;width:112px;margin:0 auto;animation:nk-pop .5s var(--ease-out) both}
.splash b{display:block;margin-top:14px;font-size:24px;letter-spacing:.02em;text-align:center}
@keyframes splash-out{to{opacity:0;visibility:hidden}}
@keyframes nk-pop{from{opacity:0;transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){.splash{animation-delay:0s;animation-duration:.01s}.card,.card:hover{transition:none;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--primary-c);border-top-color:var(--primary);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.stagger>*{animation:rise .45s var(--ease-out) both}
.stagger>*:nth-child(2){animation-delay:40ms}.stagger>*:nth-child(3){animation-delay:80ms}.stagger>*:nth-child(4){animation-delay:120ms}.stagger>*:nth-child(5){animation-delay:160ms}.stagger>*:nth-child(n+6){animation-delay:200ms}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}

/* ===== Press feedback ===== */
.ripple-ink{position:absolute;border-radius:50%;background:currentColor;opacity:.12;transform:scale(0);pointer-events:none;animation:ink .5s var(--ease) forwards}
@keyframes ink{to{transform:scale(1);opacity:0}}
[data-platform=ios] [data-tap]:active,[data-platform=ios] .btn:active,[data-platform=ios] .list-item:active,[data-platform=ios] .icon-btn:active{opacity:.4;transition:opacity 0s}
[data-platform=ios] .btn,[data-platform=ios] .list-item,[data-platform=ios] .icon-btn{transition:opacity .25s}

/* ===== Bottom navigation / tab bar ===== */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:10;display:flex;height:calc(80px + var(--nav-h));padding-bottom:var(--nav-h);background:var(--surface-2);transition:transform .3s var(--ease)}
.tabbar.hidden{transform:translateY(100%)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:500;color:var(--on-2)}
.tab .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;transition:background .25s}
.tab.on{color:var(--on)}
.tab.on .pill{background:var(--primary-c);color:var(--on-primary-c)}
[data-platform=ios] .tabbar{height:calc(50px + var(--nav-h));background:rgba(249,249,249,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 -.5px 0 var(--outline)}
[data-platform=ios] .tab{font-size:10px;gap:2px}
[data-platform=ios] .tab .pill{width:auto;height:auto;background:none!important}
[data-platform=ios] .tab.on{color:var(--primary)}

/* ===== Overlays: sheet, dialog, snackbar ===== */
.scrim{position:absolute;inset:0;z-index:600;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:700;max-height:90%;display:flex;flex-direction:column;background:var(--surface-1);border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:var(--nav-h);transform:translateY(105%);visibility:hidden}
.sheet .grip{flex-shrink:0;padding:16px 0 12px;touch-action:none}
.sheet .grip::before{content:"";display:block;margin:auto;width:32px;height:4px;border-radius:2px;background:var(--outline)}
.sheet .body{overflow-y:auto;padding:0 16px 16px}
[data-platform=ios] .sheet .grip::before{width:36px;height:5px;background:#c7c7cc}
.dialog{position:absolute;left:50%;top:50%;z-index:700;width:min(312px,85%);margin:0;background:var(--surface-3);border-radius:var(--r-xl);padding:24px;transform:translate(-50%,-50%);visibility:hidden;opacity:0}
.dialog h2{margin:0 0 16px;font-size:24px;font-weight:400}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
[data-platform=ios] .dialog{width:270px;padding:20px 16px 0;text-align:center;background:rgba(242,242,242,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
[data-platform=ios] .dialog h2{font-size:17px;font-weight:600;margin-bottom:4px}
[data-platform=ios] .dialog .actions{margin:20px -16px 0;gap:0;border-top:.5px solid var(--outline)}
[data-platform=ios] .dialog .actions .btn{flex:1;background:none;color:var(--primary);font-weight:400;height:44px;border-radius:0}
[data-platform=ios] .dialog .actions .btn+.btn{border-left:.5px solid var(--outline);font-weight:600}
.snackbar{position:absolute;left:16px;right:16px;bottom:calc(16px + var(--nav-h));z-index:800;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;border-radius:10px;background:var(--navy);color:#f5eff7;font-size:14px;transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .3s var(--ease-out),opacity .2s}
.snackbar.on{transform:none;opacity:1;pointer-events:auto}
.has-tabs .snackbar{bottom:calc(96px + var(--nav-h))}
[data-platform=ios] .snackbar{top:calc(var(--status-h) + 8px);bottom:auto;border-radius:24px;justify-content:center;background:rgba(30,30,30,.9);transform:translateY(-120%)}
[data-platform=ios] .snackbar.on{transform:none}

/* ===== Pull to refresh ===== */
.ptr{height:0;display:grid;place-items:center;overflow:visible;position:relative;z-index:2}
.ptr .spinner{position:absolute;top:0;opacity:0;transform:translateY(-40px)}

/* ===== Embedded in index.html (two phones): keep status bar, host draws the bezel ===== */
html.embed{--status-h:36px;--nav-h:24px}
html.embed body{background:transparent}
html.embed .device{width:100vw;height:100vh;border:0;border-radius:0;box-shadow:none}
html.embed .statusbar{display:flex!important}
/* Language switch in the app bar, right before the notifications bell: JA / EN / BN */
.langbar{display:flex;flex-shrink:0;gap:1px;padding:2px;margin-right:2px;border-radius:999px;background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--outline-2)}
.langbar button{min-width:30px;height:28px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.02em;color:var(--on-2);transition:background-color .2s var(--ease),color .2s var(--ease)}
.langbar button:hover{color:var(--on)}
.langbar button[aria-pressed=true]{background:var(--navy);color:#fff;box-shadow:var(--shadow-sm)}
.langbar button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
:root[data-theme=dark] .langbar button[aria-pressed=true]{background:#e6eef8;color:#14213d}
/* ===== Wakatta status colors ===== */
:root{--ok:#1e8e3e;--ok-c:#ceead6;--warn:#e37400;--warn-c:#feefc3;--bad:#d93025;--bad-c:#fad2cf;--wait:#9aa0a6}
/* PART:A:CSS */

/* PART:C:CSS */
/* PART:D:CSS */
/* PART:E:CSS */
/* PART:F:CSS */
@media (prefers-reduced-motion:reduce){*{animation-duration:1ms!important;transition-duration:1ms!important}}
</style>
</head>

/* ===== Bus: events shared between the two phones. index.html relays postMessage between iframes.
   Standalone (no parent) => Bus.paired === false: the foreman side simulates Rahim's answers itself. ===== */
const Bus = (() => {
  const h = {};
  const local = (t, p) => (h[t] || []).forEach(f => f(p));
  const paired = window.parent !== window;
  addEventListener('message', e => { if (e.data && e.data.wk) local(e.data.t, e.data.p); });
  return {
    paired,
    on: (t, f) => (h[t] = h[t] || []).push(f),
    // fires locally AND on the other phone
    emit: (t, p) => { local(t, p); if (paired) window.parent.postMessage({wk: 1, t, p}, '*'); },
  };
})();

const App = (() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const html = document.documentElement, device = $('#device'), stage = $('#stage');
  const tabbar = $('#tabbar'), scrim = $('#scrim'), snack = $('#snackbar');
  const ios = () => html.dataset.platform === 'ios';
  const dur = () => ios() ? 500 : 400;
  const ease = () => ios() ? 'cubic-bezier(.32,.72,0,1)' : 'cubic-bezier(.2,0,0,1)';
  const screen = id => $(`.screen[data-screen="${id}"]`, stage);
  let stack = [];            // [{id, params}]
  let busy = false, overlay = null, z = 20;

  /* ---- transitions (Web Animations API, so gestures can scrub them) ---- */
  function frames(kind, dir) {
    // returns [incomingKeyframes, outgoingKeyframes] for a forward move; reversed for back
    if (kind === 'modal') return [
      [{transform: 'translateY(100%)'}, {transform: 'none'}],
      ios() ? [{transform: 'none', filter: 'brightness(1)'}, {transform: 'scale(.94)', filter: 'brightness(.7)'}]
            : [{opacity: 1}, {opacity: 1}]];
    if (kind === 'fade') return [
      [{opacity: 0, transform: 'scale(.92)'}, {opacity: 1, transform: 'none'}],
      [{opacity: 1}, {opacity: 0}]];
    return ios()
      ? [[{transform: 'translateX(100%)', boxShadow: '0 0 0 rgba(0,0,0,0)'}, {transform: 'none', boxShadow: '-8px 0 24px rgba(0,0,0,.12)'}],
         [{transform: 'none', filter: 'brightness(1)'}, {transform: 'translateX(-30%)', filter: 'brightness(.9)'}]]
      : [[{transform: 'translateX(25%)', opacity: 0}, {transform: 'none', opacity: 1}],   // M3 shared axis X
         [{transform: 'none', opacity: 1}, {transform: 'translateX(-25%)', opacity: 0}]];
  }
  function animatePair(inEl, outEl, kind, back, paused) {
    const [fi, fo] = frames(kind);
    const opt = {duration: dur(), easing: paused ? 'linear' : ease(), fill: 'both', direction: back ? 'reverse' : 'normal'};
    // on back, the incoming element is the one revealed (plays the "outgoing" frames reversed)
    const a = back ? [outEl.animate(fi, opt), inEl.animate(fo, opt)] : [inEl.animate(fi, opt), outEl.animate(fo, opt)];
    if (paused) a.forEach(x => x.pause());
    return a;
  }
  const done = anims => Promise.all(anims.map(a => a.finished));
  const clear = anims => anims.forEach(a => a.cancel());

  function show(el, params = {}) {
    el.classList.add('active');
    el.scrollTop = 0;
    const hook = SCREENS[el.dataset.screen];
    if (hook) hook(el, params);
    const af = $('[data-autofocus]', el); if (af) setTimeout(() => af.focus(), dur());
    syncChrome();
  }
  function syncChrome() {
    const top = stack[stack.length - 1];
    const root = top && screen(top.id).hasAttribute('data-root');
    tabbar.classList.toggle('hidden', !root);
    device.classList.toggle('has-tabs', !!root);
    $$('.tab', tabbar).forEach(t => t.classList.toggle('on', t.dataset.tab === stack[0]?.id));
    history.replaceState(null, '', '#' + stack.map(s => s.id).join('/'));
  }

  async function push(id, params = {}) {
    if (busy || !screen(id)) return;

/* ===== Whole-app language: every visible string follows LANG (ja / en / bn) =====
   I18N holds [ja, en, bn] triples. Any variant found on screen is swapped for the chosen language,
   so text written in one language inside the parts (role branches, templates, data) follows too.
   Numbers are matched as # and put back, so "要フォロー 1件" and "要フォロー 2件" share one entry. */
const I18N_IDX = (() => {
  const idx = new Map();
  const k = s => s.replace(/\s+/g, ' ').trim().replace(/\d+/g, '#');
  for (const row of I18N) for (const v of row) if (v && !idx.has(k(v))) idx.set(k(v), row);
  return {key: k, idx};
})();
const I18N_COL = {ja: 0, en: 1, bn: 2}[LANG];
function trText(s) {
  if (!s || !/[A-Za-z぀-ヿ一-鿿ঀ-৿]/.test(s)) return null;
  const core = s.trim();
  const row = I18N_IDX.idx.get(I18N_IDX.key(core));
  if (!row) return null;
  let out = row[I18N_COL] || row[1];
  const nums = core.match(/\d+/g) || [];
  let i = 0;
  out = out.replace(/#/g, () => (i < nums.length ? nums[i++] : '#'));
  if (out === core) return null;
  const lead = s.match(/^\s*/)[0], tail = s.match(/\s*$/)[0];
  return lead + out + tail;
}
const I18N_ATTRS = ['aria-label', 'placeholder', 'title', 'data-toast'];
function trTree(root) {
  if (root.nodeType === 3) { if (root.parentElement && root.parentElement.closest('script,style,.langbar,[translate=no]')) return; const v = trText(root.nodeValue); if (v != null) root.nodeValue = v; return; }
  if (root.nodeType !== 1 || root.closest('script,style,.langbar,[translate=no]')) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (n.parentElement && n.parentElement.closest('script,style,.langbar,[translate=no]')) continue;
    const v = trText(n.nodeValue);
    if (v != null) n.nodeValue = v;
  }
  const els = [root, ...root.querySelectorAll('[aria-label],[placeholder],[title],[data-toast]')];
  for (const e of els) for (const a of I18N_ATTRS) {
    if (e.closest && e.closest('.langbar')) continue;
    const cur = e.getAttribute && e.getAttribute(a);
    if (cur) { const v = trText(cur); if (v != null) e.setAttribute(a, v); }

}
