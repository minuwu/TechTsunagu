name: Frontend CI

on:
  pull_request:
    paths: ['frontend/**', 'docs/openapi.yaml', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'docs/openapi.yaml', '.github/workflows/frontend-ci.yml']

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Generated API types match docs/openapi.yaml
        run: |
          npm run gen:api
          test -z "$(git status --porcelain -- src/services/generated)" || {
            echo "::error::src/services/generated is stale. Run: npm run gen:api, then commit the result."
            exit 1
          }

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
