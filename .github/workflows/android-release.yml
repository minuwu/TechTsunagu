name: Android release (manual)

# Manual only. Builds the signed release APK from CI secrets. Only the Release Owner starts it.
# Secrets: ANDROID_KEYSTORE_BASE64 (the .jks file, base64), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode the keystore to a temporary file
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WAKATTA_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, sign and verify
        working-directory: android
        env:
          WAKATTA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WAKATTA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WAKATTA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash tools/release/build-release.sh

      - name: Remove the temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: wakatta-release
          path: |
            android/release/wakatta-*.apk
            android/release/wakatta-*.apk.sha256
            android/release/wakatta-*-mapping.txt
            android/release/latest.json
          if-no-files-found: error
