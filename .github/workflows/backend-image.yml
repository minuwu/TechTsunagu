# Builds the backend image and pushes it to GHCR (architecture §15.1). Test CI is a separate workflow (WS0, Anim).
name: backend-image

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/techtsunagu-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/techtsunagu-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
