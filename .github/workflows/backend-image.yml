# Builds the backend image and pushes it to GHCR (architecture §15.1). Test CI is a separate workflow (WS0, Anim).
name: backend-image

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      # Actions pinned to full commit SHAs (a moved tag cannot run new code with the package-write token).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/techtsunagu-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/techtsunagu-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
