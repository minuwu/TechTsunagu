# Backend checks (AGENTS.md quality bar): lint → format → types → import layers → tests with a coverage floor against a
# real PostgreSQL 16. The secret scanner is its own workflow (secret-scan.yml): it runs on every path.
# The image build is a separate workflow (backend-deploy.yml, which runs after this one passes on main).
name: backend-ci

on:
  pull_request:
    paths: ["backend/**", "docs/openapi.yaml", ".github/workflows/backend-ci.yml"]
  push:
    branches: [main]
    paths: ["backend/**", "docs/openapi.yaml", ".github/workflows/backend-ci.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14
        env:
          POSTGRES_PASSWORD: postgres # throwaway CI container, never a real secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://wakatta_app:wakatta_app_dev@127.0.0.1:5432/wakatta_test
      TEST_MIGRATION_DATABASE_URL: postgresql+psycopg://wakatta_owner:wakatta_owner_dev@127.0.0.1:5432/wakatta_test
      # Superuser of the same throwaway container, for tests/db/test_dbinit.py (it builds a Supabase-like server).
      TEST_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      APP_DB_ROLE: wakatta_app
    steps:
      # Actions pinned to full commit SHAs, as in backend-deploy.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Create the roles and test database (backend/README.md "Local PostgreSQL")
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE wakatta_owner LOGIN PASSWORD 'wakatta_owner_dev';
          CREATE ROLE wakatta_app LOGIN PASSWORD 'wakatta_app_dev';
          ALTER ROLE wakatta_app SET statement_timeout = '5s';
          ALTER ROLE wakatta_app SET idle_in_transaction_session_timeout = '30s';
          CREATE DATABASE wakatta_test OWNER wakatta_owner;
          \c wakatta_test
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          ALTER SCHEMA public OWNER TO wakatta_owner;
          GRANT USAGE ON SCHEMA public TO wakatta_app;
          SQL

      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest --cov # fails below the coverage floor in pyproject.toml
