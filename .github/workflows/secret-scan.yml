# Secret scanner (G-37): every PR and every push to main, whatever the path, over the whole history.
# The allowlist is .gitleaks.toml. A real hit means: rotate the secret first, then clean the history.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VERSION: 8.30.1
      # From the release's own checksums; a changed download fails the job before it runs.
      SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      # Actions pinned to full commit SHAs, as in backend-ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned version and checksum)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner --verbose'
